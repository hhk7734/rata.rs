description: Returns a list of embedding objects.
content:
  application/json:
    schema:
      type: object
      title: CreateEmbeddingResponse
      properties:
        data:
          type: array
          items:
            $ref: "../schemas/Embedding.yaml"
          description: "The list of embeddings generated by the model."
        model:
          type: string
          description: "The name of the model used to generate the embedding."
        object:
          type: string
          const: list
          description: "The object type, which is always \"list\"."
        usage:
          $ref: "../schemas/EmbeddingUsage.yaml"
      required:
        - data
        - model
        - object
        - usage
