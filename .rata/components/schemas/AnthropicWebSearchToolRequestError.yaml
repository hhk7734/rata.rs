type: object
properties:
  error_code:
    $ref: ../schemas/AnthropicWebSearchToolResultErrorCode.yaml
    enum:
      - invalid_tool_input
      - unavailable
      - max_uses_exceeded
      - too_many_requests
      - query_too_long
      - request_too_large
  type:
    type: string
    const: web_search_tool_result_error
    enum:
      - web_search_tool_result_error
required:
  - error_code
  - type
