description: "`{\"type\":\"input_image\", ...}` — image input. Accepts a `file_id` (for\nan uploaded asset) or `image_url` (remote URL / data URI);\n`detail` defaults to `auto` so spec-compliant clients that omit it\nround-trip."
type: object
properties:
  detail:
    $ref: "../schemas/ImageDetail.yaml"
    default: auto
  file_id:
    anyOf:
      - type: string
      - type: "null"
  image_url:
    anyOf:
      - type: string
        format: uri
      - type: "null"
