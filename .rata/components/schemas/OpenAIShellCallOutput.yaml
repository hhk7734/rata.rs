type: object
properties:
  call_id:
    type: string
    description: The unique ID of the shell tool call generated by the model.
  output:
    type: array
    items:
      type: object
    description: An array of shell call output contents
  type:
    type: string
    const: shell_call_output
    enum:
    - shell_call_output
    description: The type of the shell call output. Always `shell_call_output`.
  id:
    type: string
    description: The unique ID of the shell call output. Populated when this item
      is returned via API.
  max_output_length:
    type: number
    description: The maximum length of the shell command output. This is generated
      by the model and should be passed back with the raw output.
  status:
    anyOf:
    - type: string
      const: in_progress
    - type: string
      const: completed
    - type: string
      const: incomplete
    description: The status of the shell call output. One of `in_progress`, `completed`,
      or `incomplete`.
  created_by:
    type: string
    description: The identifier of the actor that created the item.
required:
- call_id
- output
- max_output_length
- status
- id
- type
description: The streamed output items emitted by a shell tool call.
