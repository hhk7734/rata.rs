type: object
properties:
  server_label:
    type: string
    description: L
  type:
    type: string
    const: mcp
    enum:
      - mcp
    description: T
  allowed_tools:
    type: array
    items:
      anyOf:
        - type: string
        - type: object
    description: List of allowed tool names or a filter object.
  authorization:
    type: string
    description: 'O'
  connector_id:
    anyOf:
      - type: string
        const: connector_dropbox
