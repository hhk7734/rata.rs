type: object
properties:
  key:
    type: string
    description: The key to compare against the value.
  type:
    anyOf:
    - type: string
      const: eq
    - type: string
      const: ne
    - type: string
      const: gt
    - $ref: ../schemas/OpenAI5.yaml
    description: 'Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`,
      `lte`, `in`, `nin`.'
  value:
    anyOf:
    - type: string
    - type: number
    - type: boolean
    - type: array
      items:
        type: string
    - type: number
    description: The value to compare against the attribute key; supports string,
      number, or boolean types.
required:
- value
- key
- type
description: A filter used to compare a specified attribute key to a given value using
  a defined comparison operation.
