description: |
  `image_url` payload. `url` accepts a remote URL or `data:` URI; `uuid`
   is a gateway extension used to track multimodal assets through the
   pipeline without re-uploading raw bytes.
type: object
properties:
  url:
    type: string
    format: uri
    description: Url.
  detail:
    anyOf:
      - $ref: "../schemas/ImageDetail.yaml"
      - type: "null"
    description: Detail.
  uuid:
    anyOf:
      - type: string
        format: uuid
      - type: "null"
    description: UuID.
required:
  - url
additionalProperties: false
