description: Single-token logprob entry within a choice's logprobs payload.
type: object
properties:
  token:
    type: string
  logprob:
    type: number
    format: float
  bytes:
    anyOf:
    - type: array
      items:
        type: integer
        format: uint8
        minimum: 0
        maximum: 255
    - type: "null"
  top_logprobs:
    type: array
    items:
      $ref: "../schemas/TopLogprob.yaml"
    default: []
required:
- token
- logprob
additionalProperties: false
