type: object
properties:
  mode:
    anyOf:
      - type: string
        const: auto
        description: Must be `auto`.
      - type: string
        const: required
        description: Must be `required`.
    description: |
      Constrains the tools available to the model to a pre-defined set.
      `auto` allows the model to pick from among the allowed tools and generate a
      message.
      `required` requires the model to call one or more of the allowed tools.
  tools:
    type: array
    items:
      type: object
      additionalProperties: true
    description: 'L'
  type:
    type: string
    const: allowed_tools
    enum:
      - allowed_tools
    description: Allowed tool configuration type. Must be `allowed_tools`.
required:
  - tools
  - mode
  - type
description: |
  Constrains the tools available to the model to a pre-defined set.
