type: object
properties:
  name:
    type: string
    description: Name.
  parameters:
    $ref: ../schemas/OpenAIunknown.yaml
    description: Parameters.
  strict:
    type: boolean
    description: Strict.
  type:
    type: string
    const: function
    enum:
      - function
    description: Must be `function`.
  defer_loading:
    type: boolean
    description: |
      Whether this function should be deferred and discovered via tool search.
  description:
    type: string
    description: Description.
required:
  - parameters
  - name
  - strict
  - type
description: |
  Defines a function in your own code the model can choose to call.
