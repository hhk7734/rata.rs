description: |
  Body of a `message_delta` SSE event. Carries the terminal `stop_reason`
   plus the matched stop sequence (if any). Cumulative `usage` rides on
  the parent `CreateMessagesStreamResponse::MessageDelta` event.
type: object
properties:
  stop_reason:
    anyOf:
      - $ref: "../schemas/AnthropicStopReason.yaml"
      - type: "null"
    description: Stop reason.
  stop_sequence:
    anyOf:
      - type: string
      - type: "null"
    description: Stop sequence.
additionalProperties: false
