type: object
properties:
  skill_id:
    type: string
    description: The ID of the referenced skill.
  type:
    type: string
    const: skill_reference
    enum:
    - skill_reference
    description: References a skill created with the /v1/skills endpoint.
  version:
    type: string
    description: Optional skill version. Use a positive integer or 'latest'. Omit
      for default.
required:
- skill_id
- type
