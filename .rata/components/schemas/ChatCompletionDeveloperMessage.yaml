type: object
properties:
  content:
    anyOf:
      - type: string
      - type: array
        items:
          $ref: ../schemas/ChatCompletionContentPartText.yaml
    description: C
  role:
    type: string
    const: developer
    enum:
      - developer
    description: R
  name:
    type: string
    description: O
required:
  - content
  - role
description: |
  Developer-provided instructions that the model should follow, regardless of
  messages sent by the user. With o1 models and newer, `developer` messages
  replace the previous `system` messages.
