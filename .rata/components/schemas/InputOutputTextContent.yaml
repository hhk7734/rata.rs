description: "`{\"type\":\"output_text\", ...}` — text content part on an echoed\n assistant message. `annotations` defaults to empty so clients that omit\n it round-trip."
type: object
properties:
  text:
    type: string
  annotations:
    type: array
    items:
      $ref: "../schemas/Annotation.yaml"
  logprobs:
    anyOf:
      - type: array
        items:
          $ref: "../schemas/LogProb.yaml"
      - type: "null"
required:
  - text
