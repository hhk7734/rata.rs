type: object
properties:
  id:
    type: string
    description: Unique identifier for this Response.
  created_at:
    type: number
    description: Unix timestamp (in seconds) of when this Response was created.
  error:
    $ref: ../schemas/ResponseError.yaml
    description: An error object returned when the model fails to generate a Response.
  incomplete_details:
    type: object
    description: Details about why the response is incomplete.
  instructions:
    anyOf:
      - type: string
      - type: array
        items:
          $ref: ../schemas/OpenAIEasyInputMessage.yaml
      - type: object
      - $ref: ../schemas/ResponseOutputMessage.yaml
      - $ref: ../schemas/OpenAI27.yaml
    description: 'A system (or developer) message inserted into the model''s context.

      When using along with `previous_response_id`, the instructions from a previous

      response will not be carried over to the next response. This makes it simple

      to swap out system (or developer) messages in new responses.'
  metadata:
    $ref: ../schemas/OpenAIMetadata.yaml
    description: 'Set of 16 key-value pairs that can be attached to an object. This can be

      useful for storing additional information about the object in a structured

      format, and querying for objects via API or the dashboard.

      Keys are strings with a maximum length of 64 characters. Values are strings

      with a maximum length of 512 characters.'
  model:
    $ref: ../schemas/ResponsesModel.yaml
    description: 'Model ID used to generate the response, like `gpt-4o` or `o3`. OpenAI

      offers a wide range of models with different capabilities, performance

      characteristics, and price points. Refer to the [model guide](/docs/models)

      to browse and compare available models.'
  object:
    type: string
    const: response
    enum:
      - response
    description: The object type of this resource - always set to `response`.
  output:
    type: array
    items:
      $ref: ../schemas/ResponseOutputItem.yaml
    description: An array of content items generated by the model.
  parallel_tool_calls:
    type: boolean
    description: Whether to allow the model to run tool calls in parallel.
  temperature:
    type: number
    description: 'What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.

      We generally recommend altering this or `top_p` but not both.'
  tool_choice:
    anyOf:
      - $ref: ../schemas/OpenAIToolChoiceOptions.yaml
      - $ref: ../schemas/OpenAIToolChoiceAllowed.yaml
      - $ref: ../schemas/OpenAIToolChoiceTypes.yaml
      - $ref: ../schemas/OpenAI5.yaml
    description: 'How the model should select which tool (or tools) to use when generating

      a response. See the `tools` parameter to see how to specify which tools

      the model can call.'
  tools:
    type: array
    items:
      anyOf:
        - type: object
        - type: object
        - type: object
        - $ref: ../schemas/OpenAI12.yaml
    description: 'An array of tools the model may call while generating a response. You

      can specify which tool to use by setting the `tool_choice` parameter.

      We support the following categories of tools:'
  top_p:
    type: number
    description: 'An alternative to sampling with temperature, called nucleus sampling,

      where the model considers the results of the tokens with top_p probability

      mass. So 0.1 means only the tokens comprising the top 10% probability mass

      are considered.

      We generally recommend altering this or `temperature` but not both.'
  background:
    type: boolean
    description: 'Whether to run the model response in the background.

      [Learn more](/docs/guides/background).'
  completed_at:
    type: number
    description: 'Unix timestamp (in seconds) of when this Response was completed.

      Only present when the status is `completed`.'
  conversation:
    type: object
    description: The conversation that this response belonged to. Input items and output items from this response were automatically added to this conversation.
  max_output_tokens:
    type: number
    description: An upper bound for the number of tokens that can be generated for a response, including visible output tokens and [reasoning tokens](/docs/guides/reasoning).
  max_tool_calls:
    type: number
    description: The maximum number of total calls to built-in tools that can be processed in a response. This maximum number applies across all built-in tool calls, not per individual tool. Any further attempts to call a tool by the model will be ignored.
  moderation:
    type: object
    description: Moderation results for the response input and output, if moderated completions were requested.
  output_text:
    type: string
    description: 'SDK-only convenience property that contains the aggregated text output

      from all `output_text` items in the `output` array, if any are present.

      Supported in the Python and JavaScript SDKs.'
  previous_response_id:
    type: string
    description: 'The unique ID of the previous response to the model. Use this to

      create multi-turn conversations. Learn more about

      [conversation state](/docs/guides/conversation-state). Cannot be used in conjunction with `conversation`.'
  prompt:
    $ref: ../schemas/ResponsePrompt.yaml
    description: 'Reference to a prompt template and its variables.

      [Learn more](/docs/guides/text?api-mode=responses#reusable-prompts).'
  prompt_cache_key:
    type: string
    description: Used by OpenAI to cache responses for similar requests to optimize your cache hit rates. Replaces the `user` field. [Learn more](/docs/guides/prompt-caching).
  prompt_cache_retention:
    anyOf:
      - type: string
        const: in_memory
      - type: string
        const: 24h
    description: 'The retention policy for the prompt cache. Set to `24h` to enable extended prompt caching, which keeps cached prefixes active for longer, up to a maximum of 24 hours. [Learn more](/docs/guides/prompt-caching#prompt-cache-retention).

      For `gpt-5.5`, `gpt-5.5-pro`, and future models, only `24h` is supported.

      For older models that support both `in_memory` and `24h`, the default depends on your organization''s data retention policy:'
  reasoning:
    $ref: ../schemas/OpenAIReasoning.yaml
    description: '**gpt-5 and o-series models only**

      Configuration options for

      [reasoning models](https://platform.openai.com/docs/guides/reasoning).'
  safety_identifier:
    type: string
    description: 'A stable identifier used to help detect users of your application that may be violating OpenAI''s usage policies.

      The IDs should be a string that uniquely identifies each user, with a maximum length of 64 characters. We recommend hashing their username or email address, in order to avoid sending us any identifying information. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).'
  service_tier:
    anyOf:
      - type: string
        const: auto
      - type: string
        const: default
      - type: string
        const: flex
      - $ref: ../schemas/OpenAI2.yaml
    description: Specifies the processing type used for serving the request.
  status:
    $ref: ../schemas/ResponseStatus.yaml
    enum:
      - completed
      - failed
      - in_progress
      - cancelled
      - queued
      - incomplete
    description: 'The status of the response generation. One of `completed`, `failed`,

      `in_progress`, `cancelled`, `queued`, or `incomplete`.'
  text:
    $ref: ../schemas/ResponseTextConfig.yaml
    description: 'Configuration options for a text response from the model. Can be plain

      text or structured JSON data. Learn more:'
  top_logprobs:
    type: number
    description: 'An integer between 0 and 20 specifying the maximum number of most likely

      tokens to return at each token position, each with an associated log

      probability. In some cases, the number of returned tokens may be fewer than

      requested.'
  truncation:
    anyOf:
      - type: string
        const: auto
      - type: string
        const: disabled
    description: The truncation strategy to use for the model response.
  usage:
    $ref: ../schemas/ResponseUsage.yaml
    description: 'Represents token usage details including input tokens, output tokens,

      a breakdown of output tokens, and the total tokens used.'
  user:
    type: string
    description: 'This field is being replaced by `safety_identifier` and `prompt_cache_key`. Use `prompt_cache_key` instead to maintain caching optimizations.

      A stable identifier for your end-users.

      Used to boost cache hit rates by better bucketing similar requests and  to help OpenAI detect and prevent abuse. [Learn more](/docs/guides/safety-best-practices#safety-identifiers).

      ```http

      curl https://api.openai.com/v1/responses \

      -H ''Content-Type: application/json'' \

      -H "Authorization: Bearer $OPENAI_API_KEY" \

      -d ''{

      "model": "gpt-5.1",

      "prompt_cache_key": "prompt-cache-key-1234",

      "safety_identifier": "safety-identifier-1234",

      "temperature": 1,

      "top_p": 1,

      "user": "user-1234"

      }''

