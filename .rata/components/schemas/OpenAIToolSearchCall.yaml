type: object
properties:
  arguments:
    $ref: ../schemas/OpenAIunknown.yaml
    description: Arguments used for the tool search call.
  type:
    type: string
    const: tool_search_call
    enum:
      - tool_search_call
    description: T
  id:
    type: string
    description: U
  call_id:
    type: string
    description: U
  execution:
    anyOf:
      - type: string
        const: server
        description: Must be `server`.
      - type: string
        const: client
        description: Must be `client`.
    description: |
      Whether tool search was executed by the server or by the client.
  status:
    anyOf:
      - type: string
        const: in_progress
        description: Must be `in_progress`.
      - type: string
        const: completed
        description: Must be `completed`.
      - type: string
        const: incomplete
        description: Must be `incomplete`.
    description: S
  created_by:
    type: string
    description: I
required:
  - execution
  - call_id
  - status
  - id
  - arguments
  - type
