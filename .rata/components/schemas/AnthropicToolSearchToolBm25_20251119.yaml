type: object
properties:
  name:
    type: string
    const: tool_search_tool_bm25
    enum:
    - tool_search_tool_bm25
    description: 'Name of the tool.

      This is how the tool will be called by the model and in `tool_use` blocks.'
  type:
    anyOf:
    - type: string
      const: tool_search_tool_bm25_20251119
    - type: string
      const: tool_search_tool_bm25
  allowed_callers:
    type: array
    items:
      anyOf:
      - type: string
        const: direct
      - type: string
        const: code_execution_20250825
      - type: string
        const: code_execution_20260120
    enum:
    - direct
    - code_execution_20250825
    - code_execution_20260120
  cache_control:
    $ref: ../schemas/AnthropicCacheControl.yaml
    description: Create a cache control breakpoint at this content block.
  defer_loading:
    type: boolean
    description: If true, tool will not be included in initial system prompt. Only
      loaded when returned via tool_reference from tool search.
  strict:
    type: boolean
    description: When true, guarantees schema validation on tool names and inputs
required:
- name
- type
