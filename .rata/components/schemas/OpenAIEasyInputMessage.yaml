type: object
properties:
  content:
    anyOf:
      - type: string
      - $ref: ../schemas/ResponseInputMessageContentList.yaml
    description: |
      Text, image, or audio input to the model, used to generate a response.
      Can also contain previous assistant responses.
  role:
    anyOf:
      - type: string
        const: user
        description: Must be `user`.
      - type: string
        const: assistant
        description: Must be `assistant`.
      - type: string
        const: system
        description: Must be `system`.
      - type: string
        const: developer
        description: Must be `developer`.
    description: 'R'
  phase:
    anyOf:
      - type: string
        const: commentary
        description: Must be `commentary`.
      - type: string
        const: final_answer
        description: Must be `final_answer`.
    description: |
      Labels an `assistant` message as intermediate commentary (`commentary`) or the final answer (`final_answer`).
      For models like `gpt-5.3-codex` and beyond, when sending follow-up requests, preserve and resend
      phase on all assistant messages — dropping it can degrade performance. Not used for user messages.
  type:
    type: string
    const: message
    enum:
      - message
    description: T
required:
  - content
  - role
description: 'M'
