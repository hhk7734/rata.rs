type: object
properties:
  content:
    anyOf:
    - type: string
    - $ref: ../schemas/ResponseInputMessageContentList.yaml
    description: 'Text, image, or audio input to the model, used to generate a response.

      Can also contain previous assistant responses.'
  role:
    anyOf:
    - type: string
      const: user
    - type: string
      const: assistant
    - type: string
      const: system
    - type: string
      const: developer
    description: 'The role of the message input. One of `user`, `assistant`, `system`,
      or

      `developer`.'
  phase:
    anyOf:
    - type: string
      const: commentary
    - type: string
      const: final_answer
    description: "Labels an `assistant` message as intermediate commentary (`commentary`)\
      \ or the final answer (`final_answer`).\nFor models like `gpt-5.3-codex` and\
      \ beyond, when sending follow-up requests, preserve and resend\nphase on all\
      \ assistant messages \u2014 dropping it can degrade performance. Not used for\
      \ user messages."
  type:
    type: string
    const: message
    enum:
    - message
    description: The type of the message input. Always `message`.
required:
- content
- role
description: 'A message input to the model with a role indicating instruction following

  hierarchy. Instructions given with the `developer` or `system` role take

  precedence over instructions given with the `user` role. Messages with the

  `assistant` role are presumed to have been generated by the model in previous

  interactions.'
