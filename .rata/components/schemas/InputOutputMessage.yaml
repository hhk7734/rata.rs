description: "Echoed-back assistant message used as input on a subsequent turn.\n
  `id`, `status`, and `content` are all optional — relaxed vs the\ncanonical OutputMessage
  shape."
type: object
properties:
  content:
    type: array
    items:
      $ref: "../schemas/InputOutputMessageContent.yaml"
    default: []
  id:
    anyOf:
    - type: string
    - type: "null"
  role:
    $ref: "../schemas/AssistantRole.yaml"
  phase:
    anyOf:
    - $ref: "../schemas/MessagePhase.yaml"
    - type: "null"
  status:
    anyOf:
    - $ref: "../schemas/OutputStatus.yaml"
    - type: "null"
required:
- role
additionalProperties: false
