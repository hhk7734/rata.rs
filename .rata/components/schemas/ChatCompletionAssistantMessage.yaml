type: object
properties:
  role:
    type: string
    const: assistant
    enum:
    - assistant
    description: The role of the messages author, in this case `assistant`.
  audio:
    type: object
    description: 'Data about a previous audio response from the model.

      [Learn more](/docs/guides/audio).'
  content:
    anyOf:
    - type: string
    - type: array
      items:
        $ref: ../schemas/ChatCompletionContentPartText.yaml
    - $ref: ../schemas/ChatCompletionContentPartRefusal.yaml
    description: The contents of the assistant message. Required unless `tool_calls`
      or `function_call` is specified.
  function_call:
    type: object
    description: Deprecated and replaced by `tool_calls`. The name and arguments of
      a function that should be called, as generated by the model.
  name:
    type: string
    description: An optional name for the participant. Provides the model information
      to differentiate between participants of the same role.
  refusal:
    type: string
    description: The refusal message by the assistant.
  tool_calls:
    type: array
    items:
      $ref: ../schemas/ChatCompletionMessageToolCall.yaml
    description: The tool calls generated by the model, such as function calls.
required:
- role
description: Messages sent by the model in response to user messages.
