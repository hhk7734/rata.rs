type: object
properties:
  cited_text:
    type: string
    description: 'The full text of the cited block range, concatenated.

      Always equals the contents of `content[start_block_index:end_block_index]` joined
      together. The text block is the minimal citable unit; this field is never a
      substring of a single block. Not counted toward output tokens, and not counted
      toward input tokens when sent back in subsequent turns.'
  document_index:
    type: number
  document_title:
    type: string
  end_block_index:
    type: number
    description: 'Exclusive 0-based end index of the cited block range in the source''s
      `content` array.

      Always greater than `start_block_index`; a single-block citation has `end_block_index
      = start_block_index + 1`.'
  file_id:
    type: string
  start_block_index:
    type: number
    description: 0-based index of the first cited block in the source's `content`
      array.
  type:
    type: string
    const: content_block_location
    enum:
    - content_block_location
required:
- cited_text
- document_index
- document_title
- end_block_index
- file_id
- start_block_index
- type
