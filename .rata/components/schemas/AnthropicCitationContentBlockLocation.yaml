type: object
properties:
  cited_text:
    type: string
    description: 'F'
  document_index:
    type: number
    description: Document index.
  document_title:
    type: string
    description: Document title.
  end_block_index:
    type: number
    description: |
      Exclusive 0-based end index of the cited block range in the source's `content` array.
      Always greater than `start_block_index`; a single-block citation has `end_block_index = start_block_index + 1`.
  file_id:
    type: string
    description: File ID.
  start_block_index:
    type: number
    description: |
      0-based index of the first cited block in the source's `content` array.
  type:
    type: string
    const: content_block_location
    enum:
      - content_block_location
    description: Must be `content_block_location`.
required:
  - cited_text
  - document_index
  - document_title
  - end_block_index
  - file_id
  - start_block_index
  - type
