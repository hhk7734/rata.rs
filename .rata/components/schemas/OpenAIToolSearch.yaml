type: object
properties:
  type:
    type: string
    const: tool_search
    enum:
      - tool_search
    description: T
  description:
    type: string
    description: |
      Description shown to the model for a client-executed tool search tool.
  execution:
    anyOf:
      - type: string
        const: server
        description: Must be `server`.
      - type: string
        const: client
        description: Must be `client`.
    description: |
      Whether tool search is executed by the server or by the client.
  parameters:
    $ref: ../schemas/OpenAIunknown.yaml
    description: Parameter schema for a client-executed tool search tool.
required:
  - type
description: Hosted or BYOT tool search configuration for deferred tools.
