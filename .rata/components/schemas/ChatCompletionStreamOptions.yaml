description: |
  Streaming options. Extends OpenAI's spec with vLLM / SGLang's
   `continuous_usage_stats` flag (per-chunk usage instead of trailing-only).
   
  Both fields default to `false` when absent so an empty object
  (`"stream_options": {}`) deserializes as a no-op — matching the
  pre-Dynamo-mirror behavior where `include_usage` was `Option<bool>`.
type: object
properties:
  include_usage:
    type: boolean
    default: false
    description: Include usage.
  continuous_usage_stats:
    type: boolean
    default: false
    description: Continuous usage stats.
additionalProperties: false
