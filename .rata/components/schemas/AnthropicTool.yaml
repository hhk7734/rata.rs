description: "Tool declaration. Client tools require `name` + `input_schema`; server\n tools (web_search, code_execution, ...) are discriminated by `type` and\nmay omit `input_schema`. All non-`name` fields stay optional so both\n kinds deserialize."
type: object
properties:
  name:
    type: string
  type:
    anyOf:
      - type: string
      - type: "null"
  description:
    anyOf:
      - type: string
      - type: "null"
  input_schema: {}
  cache_control:
    anyOf:
      - $ref: "../schemas/AnthropicCacheControl.yaml"
      - type: "null"
required:
  - name
additionalProperties: false
