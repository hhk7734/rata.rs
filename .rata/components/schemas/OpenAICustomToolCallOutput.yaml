type: object
properties:
  call_id:
    type: string
    description: The call ID, used to map this custom tool call output to a custom tool call.
  output:
    anyOf:
      - type: string
      - type: array
        items:
          $ref: ../schemas/ResponseInputText.yaml
      - $ref: ../schemas/ResponseInputImage.yaml
      - $ref: ../schemas/ResponseInputFile.yaml
    description: 'The output from the custom tool call generated by your code.

      Can be a string or an list of output content.'
  type:
    type: string
    const: custom_tool_call_output
    enum:
      - custom_tool_call_output
    description: The type of the custom tool call output. Always `custom_tool_call_output`.
  id:
    type: string
    description: The unique ID of the custom tool call output item.
  status:
    anyOf:
      - type: string
        const: in_progress
      - type: string
        const: completed
      - type: string
        const: incomplete
    description: 'The status of the item. One of `in_progress`, `completed`, or

      `incomplete`. Populated when items are returned via API.'
  created_by:
    type: string
    description: The identifier of the actor that created the item.
required:
  - call_id
  - output
  - status
  - id
  - type
description: The output of a custom tool call from your code, being sent back to the model.
