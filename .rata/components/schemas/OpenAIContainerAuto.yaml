type: object
properties:
  type:
    type: string
    const: container_auto
    enum:
      - container_auto
    description: Automatically creates a container for this request
  file_ids:
    type: array
    items:
      type: string
    description: O
  memory_limit:
    anyOf:
      - type: string
        const: 1g
        description: Must be `1g`.
      - type: string
        const: 4g
        description: Must be `4g`.
      - type: string
        const: 16g
        description: Must be `16g`.
      - type: string
        const: 64g
        description: Must be `64g`.
    description: M
  network_policy:
    anyOf:
      - $ref: ../schemas/OpenAIContainerNetworkPolicyDisabled.yaml
      - $ref: ../schemas/OpenAIContainerNetworkPolicyAllowlist.yaml
    description: Network access policy for the container.
  skills:
    type: array
    items:
      anyOf:
        - $ref: ../schemas/OpenAISkillReference.yaml
        - $ref: ../schemas/OpenAIInlineSkill.yaml
    description: O
required:
  - type
