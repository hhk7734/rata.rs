type: object
properties:
  type:
    type: string
    const: container_auto
    enum:
      - container_auto
    description: Automatically creates a container for this request
  file_ids:
    type: array
    items:
      type: string
    description: An optional list of uploaded files to make available to your code.
  memory_limit:
    anyOf:
      - type: string
        const: 1g
      - type: string
        const: 4g
      - type: string
        const: 16g
      - type: string
        const: 64g
    description: The memory limit for the container.
  network_policy:
    anyOf:
      - $ref: ../schemas/OpenAIContainerNetworkPolicyDisabled.yaml
      - $ref: ../schemas/OpenAIContainerNetworkPolicyAllowlist.yaml
    description: Network access policy for the container.
  skills:
    type: array
    items:
      anyOf:
        - $ref: ../schemas/OpenAISkillReference.yaml
        - $ref: ../schemas/OpenAIInlineSkill.yaml
    description: An optional list of skills referenced by id or inline data.
required:
  - type
