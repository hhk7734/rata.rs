type: object
properties:
  button:
    anyOf:
      - type: string
        const: left
        description: Must be `left`.
      - type: string
        const: right
        description: Must be `right`.
      - type: string
        const: wheel
        description: Must be `wheel`.
      - $ref: ../schemas/OpenAI2.yaml
    description: |
      Indicates which mouse button was pressed during the click. Values: `left`, `right`, `wheel`, `back`, or `forward`.
  type:
    type: string
    const: click
    enum:
      - click
    description: |
      Specifies the event type. For a click action, this property is always `click`.
  x:
    type: number
    description: X
  y:
    type: number
    description: Y
  keys:
    type: array
    items:
      type: string
    description: K
required:
  - x
  - y
  - button
  - type
description: C
