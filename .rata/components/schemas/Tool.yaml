description: "One entry in the Responses-API `tools` array. Variants beyond\n `function` are passthrough JSON because they evolve frequently on\nOpenAI's side; only function tools have a fixed shape we need to act\non. Tag-based dispatch — unknown `type` values fail deserialization,\nmatching Dynamo / async-openai. Tool kinds added to OpenAI's spec\nrequire a new variant here."
