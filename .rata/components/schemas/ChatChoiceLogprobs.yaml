description: |
  Per-choice logprobs payload. `content` carries assistant-content tokens;
   `refusal` carries refusal-content tokens (kept for spec parity).
type: object
properties:
  content:
    anyOf:
      - type: array
        items:
          $ref: "../schemas/TokenLogprob.yaml"
      - type: "null"
    description: Content.
  refusal:
    anyOf:
      - type: array
        items:
          $ref: "../schemas/TokenLogprob.yaml"
      - type: "null"
    description: Refusal.
additionalProperties: false
