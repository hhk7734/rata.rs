type: object
properties:
  text_offset:
    type: array
    items:
      type: integer
      format: uint32
      minimum: 0
    description: Text offset.
  token_logprobs:
    type: array
    items:
      anyOf:
        - type: number
          format: float
        - type: "null"
    description: Token logprobs.
  tokens:
    type: array
    items:
      type: string
    description: Tokens.
  top_logprobs:
    type: array
    items:
      anyOf:
        - type: object
          additionalProperties: true
        - type: "null"
    description: Top logprobs.
required:
  - text_offset
  - token_logprobs
  - tokens
  - top_logprobs
additionalProperties: false
