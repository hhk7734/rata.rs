      - type: string
      - type: "null"
    start_index:
      anyOf:
      - type: integer
        format: uint32
        minimum: 0
      - type: "null"
    end_index:
      anyOf:
      - type: integer
        format: uint32
        minimum: 0
      - type: "null"
    type:
      type: string
      const: url_citation
  required:
  - type
  - url
- type: object
  properties:
    file_id:
      type: string
    index:
      anyOf:
      - type: integer
        format: uint32
        minimum: 0
      - type: "null"
    type:
      type: string
