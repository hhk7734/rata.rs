type: object
properties:
  type:
    type: string
    const: auto
    enum:
      - auto
    description: Must be `auto`.
  file_ids:
    type: array
    items:
      type: string
    description: O
  memory_limit:
    anyOf:
      - type: string
        const: 1g
        description: Must be `1g`.
      - type: string
        const: 4g
        description: Must be `4g`.
      - type: string
        const: 16g
        description: Must be `16g`.
      - type: string
        const: 64g
        description: Must be `64g`.
    description: M
  network_policy:
    anyOf:
      - $ref: ../schemas/OpenAIContainerNetworkPolicyDisabled.yaml
      - $ref: ../schemas/OpenAIContainerNetworkPolicyAllowlist.yaml
    description: Network access policy for the container.
required:
  - type
description: |
  Configuration for a code interpreter container. Optionally specify the IDs of the files to run the code on.
