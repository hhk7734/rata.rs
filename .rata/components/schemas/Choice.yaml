type: object
properties:
  index:
    type: integer
    format: uint32
    minimum: 0
    description: Index.
  message:
    $ref: "../schemas/ResponseMessage.yaml"
    description: Message.
  logprobs:
    anyOf:
      - $ref: "../schemas/ChatChoiceLogprobs.yaml"
      - type: "null"
    default:
    description: Logprobs.
  finish_reason:
    oneOf:
      - $ref: "../schemas/FinishReason.yaml"
      - type: "null"
  token_ids:
    anyOf:
      - type: array
        items:
          type: integer
      - type: "null"
  provider_specific_fields:
    type: object
    description: "LiteLLM-specific extension"
required:
  - index
  - message
additionalProperties: false
