type: object
properties:
  type:
    type: string
    const: image_generation
    enum:
      - image_generation
    description: T
  action:
    anyOf:
      - type: string
        const: generate
        description: Must be `generate`.
      - type: string
        const: edit
        description: Must be `edit`.
      - type: string
        const: auto
        description: Must be `auto`.
    description: |
      Whether to generate a new image or edit an existing image. Default: `auto`.
  background:
    anyOf:
      - type: string
        const: transparent
        description: Must be `transparent`.
      - type: string
        const: opaque
        description: Must be `opaque`.
      - type: string
        const: auto
        description: Must be `auto`.
    description: |
      Background type for the generated image. Values: `transparent`,
      `opaque`, or `auto`. Default: `auto`.
  input_fidelity:
    anyOf:
      - type: string
        const: high
        description: Must be `high`.
      - type: string
        const: low
        description: Must be `low`.
    description: |
      Control how much effort the model will exert to match the style and features, especially facial features, of input images. This parameter is only supported for `gpt-image-1` and `gpt-image-1.5` and later models, unsupported for `gpt-image-1-mini`. Supports `high` and `low`. Default: `low`.
  input_image_mask:
    type: object
    description: |
      Mask for inpainting. Contains `image_url`
      (string, optional) and `file_id` (string, optional).
  model:
    anyOf:
      - type: string
      - type: string
        const: gpt-image-1
        description: Must be `gpt-image-1`.
      - type: string
        const: gpt-image-1-mini
        description: Must be `gpt-image-1-mini`.
      - type: string
        const: gpt-image-1.5
        description: Must be `gpt-image-1.5`.
    description: 'I'
  moderation:
    anyOf:
      - type: string
        const: auto
        description: Must be `auto`.
      - type: string
        const: low
        description: Must be `low`.
    description: 'Moderation level for the generated image. Default: `auto`.'
  output_compression:
    type: number
    description: 'Compression level for the output image. Default: 100.'
  output_format:
    anyOf:
      - type: string
        const: png
        description: Must be `png`.
      - type: string
        const: webp
        description: Must be `webp`.
      - type: string
        const: jpeg
        description: Must be `jpeg`.
    description: 'O'
  partial_images:
    type: number
    description: |
      Number of partial images to generate in streaming mode, from 0 (default value) to 3.
  quality:
    anyOf:
      - type: string
        const: low
        description: Must be `low`.
      - type: string
        const: medium
        description: Must be `medium`.
      - type: string
        const: high
        description: Must be `high`.
      - type: string
        const: auto
        description: Must be `auto`.
    description: 'Q'
  size:
    anyOf:
      - type: string
      - type: string
        const: 1024x1024
        description: Must be `1024x1024`.
      - type: string
        const: 1024x1536
        description: Must be `1024x1536`.
      - type: string
        const: 1536x1024
        description: Must be `1536x1024`.
      - type: string
        const: auto
        description: Must be `auto`.
    description: S
required:
  - type
description: T
