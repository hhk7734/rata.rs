type: object
properties:
  finish_reason:
    anyOf:
    - type: string
      const: stop
    - type: string
      const: length
    - type: string
      const: content_filter
    description: 'The reason the model stopped generating tokens. This will be `stop`
      if the model hit a natural stop point or a provided stop sequence,

      `length` if the maximum number of tokens specified in the request was reached,

      or `content_filter` if content was omitted due to a flag from our content filters.'
  index:
    type: number
  logprobs:
    type: object
  text:
    type: string
required:
- finish_reason
- index
- logprobs
- text
