headers:
  content-type: application/json
body:
  model: "{{model}}"
  messages:
    - role: system
      content: |-
        You are a helpful assistant.

        The following skills are available for use with the Skill tool:

        - commit: Use when the user asks to create git commits, run /commit, commit current changes, generate commit messages, or split changed files into focused Conventional Commits without pushing.
        - commit-push: Use when the user asks to run /commit-push, commit current changes and push the branch to the remote without opening a pull request.
        - commit-push-pr: Use when the user asks to run /commit-push-pr, commit current changes, push the branch, and open a GitHub pull request from the current repository.
        - flowchart: This skill should be used when the user asks to "create a flowchart", "update a flowchart", "draw a flowchart", "visualize a workflow", "diagram a process or algorithm", or needs to represent decision trees, state transitions, or workflows using Mermaid.
        - sequence-diagram: This skill should be used when the user asks to "create a sequence diagram", "update a sequence diagram", "draw a sequence diagram", "visualize component interactions", or needs to represent time-ordered interactions between actors or system components using Mermaid.
    - role: user
      content: |-
        I need to commit these changes and push them.
  tools:
    - type: function
      function:
        name: Skill
        description: |-
          Execute a skill within the main conversation

          When users ask you to perform tasks, check if any of the available skills match. Skills provide specialized capabilities and domain knowledge.

          When users reference a "slash command" or "/<something>", they are referring to a skill. Use this tool to invoke it.

          How to invoke:
          - Set `skill` to the exact name of an available skill (no leading slash). For plugin-namespaced skills use the fully qualified `plugin:skill` form.
          - Set `args` to pass optional arguments.

          Important:
          - Available skills are listed in system-reminder messages in the conversation
          - Only invoke a skill that appears in that list, or one the user explicitly typed as `/<name>` in their message. Never guess or invent a skill name from training data; otherwise do not call this tool
          - When a skill matches the user's request, this is a BLOCKING REQUIREMENT: invoke the relevant Skill tool BEFORE generating any other response about the task
          - NEVER mention a skill without actually calling this tool
          - Do not invoke a skill that is already running
          - Do not use this tool for built-in CLI commands (like /help, /clear, etc.)
          - If you see a <command-name> tag in the current conversation turn, the skill has ALREADY been loaded - follow the instructions directly instead of calling this tool again
        parameters:
          type: object
          properties:
            skill:
              description: The name of a skill from the available-skills list. Do not guess names.
              type: string
            args:
              description: Optional arguments for the skill
              type: string
          required:
            - skill
  tool_choice: auto
