body:
  model: "{{model}}"
  messages:
    - role: "user"
      content: "Extract the name and age: Alice is 30 years old."
  response_format:
    type: "json_schema"
    json_schema:
      name: person
      strict: true
      schema:
        type: "object"
        properties:
          name:
            type: "string"
          age:
            type: "integer"
        required:
          - "name"
          - "age"
        additionalProperties: false
