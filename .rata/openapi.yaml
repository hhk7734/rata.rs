openapi: 3.1.2
info:
  title: Heimdall AI Gateway API
  description: API provided by Heimdall AI Gateway, including OpenAI-compatible and Anthropic-compatible endpoints.
  version: 0.1.0
servers:
  - url: http://localhost:8000
  - url: http://localhost:8001
paths:
  /v1/models:
    get:
      tags:
        - models
      summary: List Models
      description: Returns a list of available models.
      responses:
        "200":
          description: A list of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
  /v1/models/{model_id}:
    get:
      tags:
        - models
      summary: Get a Model
      description: Retrieves a specific model by ID.
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelObject"
  /v1/chat/completions:
    post:
      tags:
        - chat
      summary: Create a Chat Completion
      description: Creates a model response for the given chat conversation.
      requestBody:
        $ref: "#/components/requestBodies/createChatCompletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/createChatCompletionResponse"
  /v1/completions:
    post:
      tags:
        - completions
      summary: Create a Completion
      description: Creates a completion for the provided prompt and parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompletionRequest"
      responses:
        "200":
          description: A completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCompletionResponse"
  /v1/messages:
    post:
      tags:
        - messages
      summary: Create a Message
      description: Creates a message using the Anthropic API format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessagesRequest"
      responses:
        "200":
          description: A message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessagesResponse"
  /v1/responses:
    post:
      tags:
        - responses
      summary: Create a Response
      description: Responses endpoint for Heimdall Gateway.
      responses:
        "200":
          description: A response object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponseResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseRequest"
  /health:
    get:
      summary: Get Health
      description: Returns the health status of the gateway.
      responses:
        "200":
          description: Gateway is healthy
  /metrics:
    get:
      tags:
        - system
      summary: Get Metrics
      description: Prometheus metrics endpoint.
      responses:
        "200":
          description: Prometheus metrics payload
          content:
            text/plain:
              schema:
                type: string
  /debug/metrics-store:
    get:
      tags:
        - system
      summary: Get Metrics for debugging
      description: Returns internal metrics store state for debugging.
      responses:
        "200":
          description: Debug info
  /debug/reset-prefix-cache:
    post:
      tags:
        - system
      summary: Reset Prefix Cache
      description: Resets the prefix cache for debugging purposes.
      responses:
        "200":
          description: Cache reset successful
components:
  requestBodies:
    createChatCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateChatCompletionRequest"
  responses:
    createChatCompletionResponse:
      description: A chat completion response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateChatCompletionResponse"
  schemas:
    Annotation:
      description: Citation / annotation attached to an `output_text` part.
      anyOf:
        - type: object
          properties:
            file_id:
              type: string
            index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            filename:
              anyOf:
                - type: string
                - type: "null"
            type:
              type: string
              const: file_citation
          required:
            - type
            - file_id
        - type: object
          properties:
            url:
              type: string
              format: uri
            title:
              anyOf:
                - type: string
                - type: "null"
            start_index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            end_index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            type:
              type: string
              const: url_citation
          required:
            - type
            - url
        - type: object
          properties:
            file_id:
              type: string
            index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            type:
              type: string
              const: file_path
          required:
            - type
            - file_id
        - description: Forward-compatible catch-all.
    ApplyPatchToolCallItemParam: {}
    ApplyPatchToolCallOutputItemParam: {}
    AssistantRole:
      description:
        'Single-variant role enum used to constrain `InputOutputMessage.role`

        to `"assistant"` only.'
      type: string
      enum:
        - assistant
    AudioUrl:
      description:
        "`audio_url` payload (vLLM extension). Distinct from OpenAI's base64

        `input_audio` shape."
      type: object
      properties:
        url:
          type: string
          format: uri
        uuid:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - url
    ChatChoiceLogprobs:
      description:
        "Per-choice logprobs payload. `content` carries assistant-content tokens;

        `refusal` carries refusal-content tokens (kept for spec parity)."
      type: object
      properties:
        content:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/TokenLogprob"
            - type: "null"
        refusal:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/TokenLogprob"
            - type: "null"
    ChatCompletionAudio:
      description: "`audio` request configuration \u2014 voice + output format for audio\nmodality responses."
      type: object
      properties:
        voice:
          $ref: "#/components/schemas/ChatCompletionAudioVoice"
        format:
          $ref: "#/components/schemas/ChatCompletionAudioFormat"
      required:
        - voice
        - format
    ChatCompletionAudioFormat:
      type: string
      enum:
        - wav
        - aac
        - mp3
        - flac
        - opus
        - pcm16
    ChatCompletionAudioVoice:
      type: string
      enum:
        - alloy
        - ash
        - ballad
        - coral
        - echo
        - fable
        - onyx
        - nova
        - sage
        - shimmer
        - verse
    ChatCompletionNamedToolChoice:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ChatCompletionToolType"
        function:
          $ref: "#/components/schemas/FunctionName"
      required:
        - type
        - function
    ChatCompletionRequestAssistantMessage:
      type: object
      properties:
        content:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContent"
            - type: "null"
        reasoning_content:
          anyOf:
            - $ref: "#/components/schemas/ReasoningContent"
            - type: "null"
        refusal:
          anyOf:
            - type: string
            - type: "null"
        name:
          anyOf:
            - type: string
            - type: "null"
        audio:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageAudio"
            - type: "null"
        tool_calls:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolCall"
            - type: "null"
    ChatCompletionRequestAssistantMessageAudio:
      description: Assistant-side audio reference echoed back in multi-turn audio threads.
      type: object
      properties:
        id:
          type: string
      required:
        - id
    ChatCompletionRequestAssistantMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContentPart"
    ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: refusal
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartRefusal"
          required:
            - type
    ChatCompletionRequestDeveloperMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestDeveloperMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessageContentPart"
    ChatCompletionRequestDeveloperMessageContentPart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
          required:
            - type
    ChatCompletionRequestMessage:
      oneOf:
        - type: object
          properties:
            role:
              type: string
              const: system
          $ref: "#/components/schemas/ChatCompletionRequestSystemMessage"
          required:
            - role
        - type: object
          properties:
            role:
              type: string
              const: developer
          $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessage"
          required:
            - role
        - type: object
          properties:
            role:
              type: string
              const: user
          $ref: "#/components/schemas/ChatCompletionRequestUserMessage"
          required:
            - role
        - type: object
          properties:
            role:
              type: string
              const: assistant
          $ref: "#/components/schemas/ChatCompletionRequestAssistantMessage"
          required:
            - role
        - type: object
          properties:
            role:
              type: string
              const: tool
          $ref: "#/components/schemas/ChatCompletionRequestToolMessage"
          required:
            - role
    ChatCompletionRequestMessageContentPartAudio:
      description: '`{"type":"input_audio","input_audio":{...}}` content part.'
      type: object
      properties:
        input_audio:
          $ref: "#/components/schemas/InputAudio"
      required:
        - input_audio
    ChatCompletionRequestMessageContentPartAudioUrl:
      description: '`{"type":"audio_url","audio_url":{...}}` content part (vLLM extension).'
      type: object
      properties:
        audio_url:
          $ref: "#/components/schemas/AudioUrl"
      required:
        - audio_url
    ChatCompletionRequestMessageContentPartFile:
      description:
        '`{"type":"file","file":{...}}` content part. `file` is left typed as

        `serde_json::Value` because OpenAI accepts multiple sub-shapes

        (`{file_id}`, `{file_data, filename}`) that the gateway forwards as-is.'
      type: object
      properties:
        file: {}
      required:
        - file
    ChatCompletionRequestMessageContentPartImage:
      description: '`{"type":"image_url","image_url":{...}}` content part.'
      type: object
      properties:
        image_url:
          $ref: "#/components/schemas/ImageUrl"
      required:
        - image_url
    ChatCompletionRequestMessageContentPartRefusal:
      description: "Body for `{\"type\":\"refusal\",\"refusal\":\"\u2026\"}` content parts. Only valid\non assistant turns echoed back as input \u2014 refusal text from a prior\nresponse."
      type: object
      properties:
        refusal:
          type: string
      required:
        - refusal
    ChatCompletionRequestMessageContentPartText:
      description: "Shared body for every `{\"type\":\"text\",\"text\":\"\u2026\"}` content part."
      type: object
      properties:
        text:
          type: string
      required:
        - text
    ChatCompletionRequestMessageContentPartVideo:
      description: '`{"type":"video_url","video_url":{...}}` content part (vLLM extension).'
      type: object
      properties:
        video_url:
          $ref: "#/components/schemas/VideoUrl"
      required:
        - video_url
    ChatCompletionRequestSystemMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestSystemMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestSystemMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestSystemMessageContentPart"
    ChatCompletionRequestSystemMessageContentPart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
          required:
            - type
    ChatCompletionRequestToolMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestToolMessageContent"
        tool_call_id:
          type: string
      required:
        - content
        - tool_call_id
    ChatCompletionRequestToolMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestToolMessageContentPart"
    ChatCompletionRequestToolMessageContentPart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
          required:
            - type
    ChatCompletionRequestUserMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestUserMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestUserMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestUserMessageContentPart"
    ChatCompletionRequestUserMessageContentPart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: image_url
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartImage"
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: input_audio
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartAudio"
          required:
            - type
        - description: "vLLM extension: video reference passed by URL."
          type: object
          properties:
            type:
              type: string
              const: video_url
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartVideo"
          required:
            - type
        - description:
            "vLLM extension: audio reference passed by URL (distinct from base64

            `input_audio`)."
          type: object
          properties:
            type:
              type: string
              const: audio_url
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartAudioUrl"
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: file
          $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartFile"
          required:
            - type
    ChatCompletionResponseMessageAudio:
      description:
        "Audio reference returned on assistant messages when the response

        includes the `audio` modality."
      type: object
      properties:
        id:
          type: string
        expires_at:
          anyOf:
            - type: integer
              format: uint64
              minimum: 0
            - type: "null"
        data:
          anyOf:
            - type: string
            - type: "null"
        transcript:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
    ChatCompletionStreamOptions:
      description: "Streaming options. Extends OpenAI's spec with vLLM / SGLang's\n`continuous_usage_stats` flag (per-chunk usage instead of trailing-only).\n\nBoth fields default to `false` when absent so an empty object\n(`\"stream_options\": {}`) deserializes as a no-op \u2014 matching the\npre-Dynamo-mirror behavior where `include_usage` was `Option<bool>`."
      type: object
      properties:
        include_usage:
          type: boolean
          default: false
        continuous_usage_stats:
          type: boolean
          default: false
    ChatCompletionTool:
      description: One entry in the request's `tools` array.
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ChatCompletionToolType"
          default: function
        function:
          $ref: "#/components/schemas/FunctionObject"
      required:
        - function
    ChatCompletionToolChoiceOption:
      description: "Tool-choice policy. The lowercase string variants (`none` / `auto` /\n`required`) match OpenAI's spec; a specific named tool deserializes\nfrom the struct form `{ \"type\": \"function\", \"function\": { \"name\": \"\u2026\" } }`."
      anyOf:
        - type: string
          enum:
            - none
            - auto
            - required
        - $ref: "#/components/schemas/ChatCompletionNamedToolChoice"
    ChatCompletionToolType:
      description: Tool-type discriminator. OpenAI currently defines only `function`.
      type: string
      enum:
        - function
    Choice:
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        message:
          $ref: "#/components/schemas/ResponseMessage"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ChatChoiceLogprobs"
            - type: "null"
          default: null
        finish_reason:
          anyOf:
            - $ref: "#/components/schemas/FinishReason"
            - type: "null"
      required:
        - index
        - message
    ChunkChoice:
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        delta:
          $ref: "#/components/schemas/Delta"
        finish_reason:
          anyOf:
            - $ref: "#/components/schemas/FinishReason"
            - type: "null"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ChatChoiceLogprobs"
            - type: "null"
      required:
        - index
        - delta
    CodeInterpreterToolCall: {}
    CompactionSummaryItemParam: {}
    CompletionChoice:
      type: object
      properties:
        text:
          type: string
        index:
          type: integer
          format: uint32
          minimum: 0
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/Logprobs"
            - type: "null"
        finish_reason:
          anyOf:
            - type: string
            - type: "null"
      required:
        - text
        - index
    CompletionTokensDetails:
      type: object
      properties:
        reasoning_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        audio_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        accepted_prediction_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        rejected_prediction_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
    CompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: uint32
          minimum: 0
        completion_tokens:
          type: integer
          format: uint32
          minimum: 0
        total_tokens:
          type: integer
          format: uint32
          minimum: 0
        prompt_tokens_details:
          anyOf:
            - $ref: "#/components/schemas/PromptTokensDetails"
            - type: "null"
        completion_tokens_details:
          anyOf:
            - $ref: "#/components/schemas/CompletionTokensDetails"
            - type: "null"
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
    ComputerCallOutputItemParam: {}
    ComputerToolCall: {}
    ContentBlock:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        annotations:
          anyOf:
            - type: array
              items: {}
            - type: "null"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ContentBlockLogprobs"
            - type: "null"
      required:
        - type
        - text
    ContentBlockLogprobs:
      anyOf:
        - type: array
          items:
            $ref: "#/components/schemas/LogProb"
        - type: "null"
    ConversationParam:
      description: "`conversation` request parameter \u2014 either an id reference or an\ninline new-conversation spec."
      anyOf:
        - type: string
        - {}
    CreateChatCompletionRequest:
      required:
        - model
        - messages
      title: CreateChatCompletionRequest
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestMessage"
          minItems: 1
        temperature:
          anyOf:
            - type: number
              format: float
            - type: "null"
        top_p:
          anyOf:
            - type: number
              format: float
            - type: "null"
        top_k:
          anyOf:
            - type: integer
              description: "vLLM-extension: top-k sampling. `0` disables."
              format: int32
            - type: "null"
        min_p:
          anyOf:
            - type: number
              description: "vLLM-extension: minimum token probability relative to the top token."
              format: float
            - type: "null"
        repetition_penalty:
          anyOf:
            - type: number
              description: "vLLM-extension: repetition penalty (`1.0` = neutral)."
              format: float
            - type: "null"
        max_completion_tokens:
          anyOf:
            - type: integer
              description:
                "Accepts the deprecated `max_tokens` JSON key as an alias. Sending

                both keys in a single request is rejected at deserialize as a

                duplicate field."
              format: uint32
              minimum: 0
            - type: "null"
        min_tokens:
          anyOf:
            - type: integer
              description:
                "vLLM-extension: minimum tokens to generate before EOS / stop can

                end the response."
              format: uint32
              minimum: 0
            - type: "null"
        n:
          anyOf:
            - type: integer
              description: "Number of completion choices to generate. OpenAI caps at 128;\n`u8` (max 255) is the soft upper bound \u2014 the backend enforces any\ntighter limit. `n = 0` is rejected at validation time."
              format: uint8
              minimum: 1
              maximum: 255
            - type: "null"
        stop:
          anyOf:
            - $ref: "#/components/schemas/Stop"
            - type: "null"
        ignore_eos:
          anyOf:
            - type: boolean
              description: "vLLM-extension: continue generating past EOS until

                `max_completion_tokens` is reached."
            - type: "null"
        seed:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
        presence_penalty:
          anyOf:
            - type: number
              format: float
            - type: "null"
        frequency_penalty:
          anyOf:
            - type: number
              format: float
            - type: "null"
        stream:
          anyOf:
            - type: boolean
            - type: "null"
        stream_options:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionStreamOptions"
            - type: "null"
        reasoning_effort:
          anyOf:
            - $ref: "#/components/schemas/ReasoningEffort"
            - type: "null"
        thinking_token_budget:
          anyOf:
            - type: integer
              description: "vLLM-extension: cap on tokens emitted during the thinking phase."
              format: uint32
              minimum: 0
            - type: "null"
        tools:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ChatCompletionTool"
            - type: "null"
        tool_choice:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionToolChoiceOption"
            - type: "null"
        parallel_tool_calls:
          anyOf:
            - type: boolean
            - type: "null"
        logprobs:
          anyOf:
            - type: boolean
            - type: "null"
        top_logprobs:
          anyOf:
            - type: integer
              format: uint8
              minimum: 0
              maximum: 255
            - type: "null"
        logit_bias:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        modalities:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ResponseModality"
            - type: "null"
        prediction:
          anyOf:
            - $ref: "#/components/schemas/PredictionContent"
            - type: "null"
        audio:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionAudio"
            - type: "null"
        response_format:
          anyOf:
            - $ref: "#/components/schemas/ResponseFormat"
            - type: "null"
        service_tier:
          anyOf:
            - $ref: "#/components/schemas/ServiceTier"
            - type: "null"
        metadata: {}
        store:
          anyOf:
            - type: boolean
