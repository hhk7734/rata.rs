            - name
        - description: Result from a server-initiated web-search tool execution.
          type: object
          properties:
            tool_use_id:
              type: string
            content:
              default: null
            type:
              type: string
              const: web_search_tool_result
          required:
            - type
            - tool_use_id
        - description:
            "Catch-all for unrecognized block types so the proxy can preserve

            blocks Claude has added but the gateway does not yet model."
