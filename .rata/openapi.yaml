          properties:
            tool_use_id:
              type: string
            content:
              $ref: "#/components/schemas/AnthropicToolResultContent"
            is_error:
              type: boolean
              default: false
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: tool_result
          required:
            - type
            - tool_use_id
            - content
        - type: object
          properties:
            thinking:
              type: string
            signature:
              type: string
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: thinking
          required:
            - type
            - thinking
            - signature
        - type: object
          properties:
            data:
              type: string
            type:
              type: string
              const: redacted_thinking
          required:
            - type
            - data
        - description:
            "Server-initiated tool use (e.g. web search). The model issues the

            tool call and the server executes it; the result returns as a

            `web_search_tool_result` (or sibling) block."
          type: object
          properties:
