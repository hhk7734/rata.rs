              default: null
            - type: "null"
    CreateMessagesResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        role:
          type: string
        model:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicOutputBlock"
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/AnthropicStopReason"
            - type: "null"
        stop_sequence:
          anyOf:
            - type: string
            - type: "null"
        usage:
          $ref: "#/components/schemas/AnthropicUsage"
        anthropic_version:
          anyOf:
            - type: string
              description:
                "Anthropic-version header echo. Populated when the proxy mirrors it

                onto the response body."
            - type: "null"
        container:
          anyOf:
            - type: string
              description:
                "Container identifier echoed back when the request used a stateful

                sandbox session."
            - type: "null"
      required:
        - id
        - type
        - role
        - model
        - content
        - usage
    AnthropicCreateMessagesStreamResponse:
      oneOf:
        - description:
            "First event. Carries the initial message envelope (id, model, empty

            `content`, initial `usage` with `input_tokens` populated)."
          type: object
          properties:
            message:
              $ref: "#/components/schemas/CreateMessagesResponse"
            type:
              type: string
              const: message_start
          required:
            - type
            - message
        - description: "Final summary event. Carries `delta.stop_reason` /

            `delta.stop_sequence` plus cumulative final `usage`."
          type: object
          properties:
            delta:
              $ref: "#/components/schemas/AnthropicMessageDeltaBody"
            usage:
              $ref: "#/components/schemas/AnthropicUsage"
            type:
              type: string
              const: message_delta
          required:
            - type
            - delta
            - usage
        - description:
            "Terminal event. Empty payload; presence of this event closes the

            stream from the protocol's perspective."
          type: object
          properties:
            type:
              type: string
              const: message_stop
          required:
            - type
        - description:
            "Marks the start of an output content block at `index`. The

            `content_block` is shape-only (empty text, empty input)."
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            content_block:
              $ref: "#/components/schemas/AnthropicOutputBlock"
            type:
              type: string
              const: content_block_start
          required:
            - type
            - index
            - content_block
        - description: Incremental update to the block at `index`.
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            delta:
              $ref: "#/components/schemas/AnthropicContentBlockDelta"
            type:
              type: string
              const: content_block_delta
          required:
            - type
            - index
            - delta
        - description: Marks the block at `index` as complete.
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            type:
              type: string
              const: content_block_stop
          required:
            - type
            - index
        - description: Server-side keepalive. Carries no payload; safe to ignore.
          type: object
          properties:
            type:
              type: string
              const: ping
          required:
            - type
        - description: Stream-level error. Closes the stream.
          type: object
          properties:
            error:
              $ref: "#/components/schemas/AnthropicErrorBody"
            type:
              type: string
              const: error
          required:
            - type
            - error
      title: CreateMessagesStreamResponse
      description: 'SSE event union for `POST /v1/messages` streaming responses.


        Wire shape: each variant serializes as `{"type": "<event>", ...}` and

        is emitted as the JSON body of an SSE frame. The SSE `event:` line

        matches the JSON `type` discriminator by convention; clients dispatch

        on either independently.


        Typical event order for a plain-text turn:


        ```text

        message_start

        content_block_start  (index=0, type=text)

        content_block_delta  (text_delta, repeated)

        content_block_stop   (index=0)

        message_delta        (stop_reason, final usage)

        message_stop

        ```'
    AnthropicErrorBody:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required:
        - type
        - message
    AnthropicErrorEnvelope:
      required:
        - type
        - error
      title: AnthropicErrorEnvelope
      type: object
      properties:
        type:
          type: string
        error:
          $ref: "#/components/schemas/AnthropicErrorBody"
    AnthropicImageSource:
      description: "Image source descriptor \u2014 base64-encoded inline data or a remote URL."
      type: object
      properties:
        type:
          type: string
        media_type:
          anyOf:
            - type: string
            - type: "null"
        data:
          anyOf:
            - type: string
            - type: "null"
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
      required:
        - type
    AnthropicMessage:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AnthropicRole"
        content:
          $ref: "#/components/schemas/AnthropicMessageContent"
      required:
        - role
        - content
    AnthropicMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicContentBlock"
    AnthropicMessageDeltaBody:
      description:
        "Body of a `message_delta` SSE event. Carries the terminal `stop_reason`

        plus the matched stop sequence (if any). Cumulative `usage` rides on

        the parent `CreateMessagesStreamResponse::MessageDelta` event."
      type: object
      properties:
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/AnthropicStopReason"
            - type: "null"
        stop_sequence:
          anyOf:
            - type: string
            - type: "null"
    AnthropicModelObject:
      required:
        - id
        - type
        - display_name
        - created_at
      title: AnthropicModelObject
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        display_name:
          type: string
        created_at:
          type: string
        max_input_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
    AnthropicModelsResponse:
      required:
        - data
        - has_more
      title: AnthropicModelsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicModelObject"
        has_more:
          type: boolean
        first_id:
          anyOf:
            - type: string
            - type: "null"
        last_id:
          anyOf:
            - type: string
            - type: "null"
    AnthropicOutputBlock:
      description:
        "Output content block for the non-streaming response. The streaming

        `content_block_start` event reuses the same enum."
      anyOf:
        - type: object
          properties:
            text:
              type: string
            citations:
              anyOf:
                - type: array
                  items: {}
                - type: "null"
            type:
              type: string
              const: text
          required:
            - type
            - text
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            input: {}
            type:
              type: string
              const: tool_use
          required:
            - type
            - id
            - name
            - input
        - type: object
          properties:
            thinking:
              type: string
            signature:
              type: string
            type:
              type: string
              const: thinking
          required:
            - type
            - thinking
            - signature
        - type: object
          properties:
            data:
              type: string
            type:
              type: string
              const: redacted_thinking
          required:
            - type
            - data
        - description:
            "Server-initiated tool call (e.g. web_search). The matching result

            arrives as `web_search_tool_result` or a sibling block."
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            input:
              default: null
            type:
              type: string
              const: server_tool_use
          required:
            - type
            - id
            - name
        - description: Result of a server-initiated web_search tool call.
          type: object
          properties:
            tool_use_id:
              type: string
            content:
              default: null
            type:
              type: string
              const: web_search_tool_result
          required:
            - type
            - tool_use_id
        - description:
            "Catch-all for response blocks the gateway does not yet model

            (`web_fetch_tool_result`, `code_execution_tool_result`, etc.) so

            they round-trip unchanged."
    AnthropicRole:
      oneOf:
        - type: string
          enum:
            - user
            - assistant
        - description:
            "Compatibility for clients (e.g. Claude Code) that place system

            instructions in `messages[]` instead of the top-level `system` field."
          type: string
          const: system
    AnthropicStopReason:
      oneOf:
        - type: string
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
            - tool_use
        - description:
            "Model paused mid-turn intending to continue (extended thinking /

            tool-use loops)."
          type: string
          const: pause_turn
        - description: "Safety refusal \u2014 model declined to generate content."
          type: string
          const: refusal
    AnthropicSystemPrompt:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicSystemTextBlock"
    AnthropicSystemTextBlock:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        cache_control:
          anyOf:
            - $ref: "#/components/schemas/AnthropicCacheControl"
            - type: "null"
        citations:
          anyOf:
            - type: array
              items: {}
            - type: "null"
      required:
        - type
        - text
    AnthropicThinkingConfig:
      type: object
      properties:
        type:
          type: string
        budget_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      required:
        - type
    AnthropicTool:
      description:
        "Tool declaration. Client tools require `name` + `input_schema`; server

        tools (web_search, code_execution, ...) are discriminated by `type` and

        may omit `input_schema`. All non-`name` fields stay optional so both

        kinds deserialize."
      type: object
      properties:
        name:
          type: string
        type:
          anyOf:
            - type: string
            - type: "null"
        description:
          anyOf:
            - type: string
            - type: "null"
        input_schema: {}
        cache_control:
          anyOf:
            - $ref: "#/components/schemas/AnthropicCacheControl"
            - type: "null"
      required:
        - name
    AnthropicToolChoice:
      oneOf:
        - type: object
          properties:
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: auto
          required:
            - type
        - type: object
          properties:
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: any
          required:
            - type
        - type: object
          properties:
            name:
              type: string
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: tool
          required:
            - type
            - name
        - type: object
          properties:
            type:
              type: string
              const: none
          required:
            - type
    AnthropicToolResultBlock:
      oneOf:
        - type: object
          properties:
            text:
              type: string
            type:
              type: string
              const: text
          required:
            - type
            - text
        - type: object
          properties:
            source: {}
            type:
              type: string
              const: image
          required:
            - type
            - source
    AnthropicToolResultContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicToolResultBlock"
    AnthropicUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          format: uint32
          minimum: 0
        output_tokens:
          type: integer
          format: uint32
          minimum: 0
        cache_creation_input_tokens:
          anyOf:
            - type: integer
              description: Number of input tokens used to create a new cache entry.
              format: uint32
              minimum: 0
            - type: "null"
        cache_read_input_tokens:
          anyOf:
            - type: integer
              description: Number of input tokens read from the prompt cache (prefix cache hits).
              format: uint32
              minimum: 0
            - type: "null"
        cache_creation:
          description: Breakdown of `cache_creation_input_tokens` by cache TTL bucket.
        service_tier:
          anyOf:
            - type: string
              description:
                'Service tier that actually served the request (`"standard"` /

                `"priority"` / `"batch"`).'
            - type: "null"
        server_tool_use:
          description: Per-server-tool token counts (e.g. web_search requests).
      required:
        - input_tokens
        - output_tokens
tags:
  - name: models
    description: models for OpenAI/Anthropic compatible Models API.
  - name: chat
    description: OpenAI-compatible Chat API.
  - name: completions
    description: OpenAI-compatible Completions API.
  - name: responses
    description: OpenAI-compatible Responses API.
  - name: messages
    description: Anthropic-compatible Messages API.
  - name: system
    description: System endpoints for health, metrics, and debugging.
