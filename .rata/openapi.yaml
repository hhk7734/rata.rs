                - type: "null"
            context:
              anyOf:
                - type: string
                - type: "null"
            citations: {}
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: document
          required:
            - type
            - source
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            input: {}
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: tool_use
          required:
            - type
            - id
            - name
            - input
