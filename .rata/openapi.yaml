      properties:
        id:
          type: string
        version:
          anyOf:
            - type: string
            - type: "null"
        variables: {}
      required:
        - id
      additionalProperties: false
    CreateCompletionRequestPrompt:
      oneOf:
        - type: string
        - type: integer
          format: uint32
        - type: array
          items:
            oneOf:
              - type: string
              - type: integer
                format: uint32
    PromptCacheRetention:
      description:
        "`prompt_cache_retention` hint — `\"5m\"` / `\"1h\"` / arbitrary
        string for\nforward compatibility."
      anyOf:
        - $ref: "#/components/schemas/KnownPromptCacheRetention"
        - type: string
    PromptTokensDetails:
      type: object
      properties:
        cached_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        audio_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      additionalProperties: false
    Reasoning:
      description:
        "`reasoning` request parameter — full Dynamo shape with `effort`,\n
        `summary`, and `generate_summary` accepted as a serde alias."
      type: object
      properties:
        effort:
          anyOf:
            - $ref: "#/components/schemas/ReasoningEffort"
            - type: "null"
        summary:
          anyOf:
            - $ref: "#/components/schemas/ReasoningSummary"
            - type: "null"
      additionalProperties: false
    ReasoningContent:
      description:
        "Echo of an assistant turn's reasoning content. Accepts a flat
        string\n(legacy / single-block form) or an interleaved-segment array where\n
        `segments[i]` precedes `tool_calls[i]`."
      anyOf:
        - type: string
        - type: array
          items:
            type: string
    ReasoningContentPart:
      anyOf:
        - type: object
          properties:
            text:
              type: string
            type:
              type: string
              const: reasoning_text
          required:
            - type
            - text
        - description: Forward-compatible catch-all.
    ReasoningEffort:
      description: Reasoning-effort hint. Shared by Chat and Responses.
      type: string
      enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
    ReasoningItem:
      type: object
      properties:
        summary:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningSummaryContent"
        content:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningContentPart"
        id:
          anyOf:
            - type: string
            - type: "null"
        status:
          anyOf:
            - $ref: "#/components/schemas/OutputStatus"
            - type: "null"
        encrypted_content:
          anyOf:
            - type: string
            - type: "null"
    ReasoningSummary:
      type: string
      enum:
        - auto
        - concise
        - detailed
    ReasoningSummaryContent:
      anyOf:
        - type: object
          properties:
            text:
              type: string
            type:
              type: string
              const: summary_text
          required:
            - type
            - text
        - description: Forward-compatible catch-all.
    RefusalContent:
      description:
        "`{\"type\":\"refusal\",\"refusal\":\"…\"}` — refusal content part
        on an\nassistant message."
      type: object
      properties:
        refusal:
          type: string
      required:
        - refusal
    ResponseFormat:
      description:
        "`response_format` configuration. OpenAI defines three modes:\n
        `text` (default), `json_object`, and `json_schema`."
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: json_object
          required:
            - type
        - type: object
          properties:
            json_schema:
              $ref: "#/components/schemas/ResponseFormatJsonSchema"
            type:
              type: string
              const: json_schema
          required:
            - type
            - json_schema
    ResponseFormatJsonSchema:
      type: object
      properties:
        name:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
        schema: {}
        strict:
          anyOf:
            - type: boolean
            - type: "null"
      required:
        - name
    ResponseInput:
      description:
        "Input to a `POST /v1/responses` request — a flat string or an
        array\nof [`InputItem`]s (messages, function calls, reasoning, hosted-tool\n
        items, ...). Mirrors Dynamo's `InputParam`."
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/InputItem"
    ResponseInputTokensDetails:
      type: object
      properties:
        cached_tokens:
          type: integer
          format: uint32
          minimum: 0
      required:
        - cached_tokens
      additionalProperties: false
    ResponseMessage:
      type: object
      properties:
        role:
          type: string
        content:
          anyOf:
            - type: string
            - type: "null"
        refusal:
          anyOf:
            - type: string
              default:
            - type: "null"
        annotations:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ResponseMessageAnnotation"
              default:
            - type: "null"
        audio:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionResponseMessageAudio"
            - type: "null"
          default:
        function_call:
          anyOf:
            - $ref: "#/components/schemas/ResponseMessageFunctionCall"
            - type: "null"
          default:
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          default: []
        reasoning_content:
          anyOf:
            - type: string
            - type: "null"
      required:
        - role
      additionalProperties: false
    ResponseMessageAnnotation:
      description:
        "Annotation attached to assistant output — citation references
        for\nweb-search / file-search results."
      anyOf:
        - type: object
          properties:
            url_citation:
              $ref: "#/components/schemas/UrlCitation"
            type:
              type: string
              const: url_citation
          required:
            - type
            - url_citation
        - type: object
          properties:
            file_citation:
              $ref: "#/components/schemas/FileCitation"
            type:
              type: string
              const: file_citation
          required:
            - type
            - file_citation
        - description:
            Catch-all so future citation kinds round-trip without data
            loss.
    ResponseMessageFunctionCall:
      description:
        "Deprecated `function_call` echo. OpenAI keeps it on the response
        for\nbackwards compatibility with pre-tools-API clients."
      type: object
      properties:
        name:
          type: string
        arguments:
          type: string
      required:
        - name
        - arguments
      additionalProperties: false
    ResponseModality:
      description:
        "Output modalities the model may produce. OpenAI defines `text`
        and\n`audio`; vLLM-side multimodal models accept the same set."
      type: string
      enum:
        - text
        - audio
    ResponseOutputTokensDetails:
      type: object
      properties:
        reasoning_tokens:
          type: integer
          format: uint32
          minimum: 0
      required:
        - reasoning_tokens
      additionalProperties: false
    ResponseStreamOptions:
      description:
        "Streaming option — request that lifecycle event snapshots embed\n
        `obfuscation` tokens."
      type: object
      properties:
        include_obfuscation:
          anyOf:
            - type: boolean
            - type: "null"
      additionalProperties: false
    ResponseTextParam:
      description:
        "`text` request parameter — output format pin (`response_format`\n
        equivalent for the Responses API)."
      type: object
      properties:
        format:
          anyOf:
            - $ref: "#/components/schemas/TextResponseFormatConfiguration"
            - type: "null"
        verbosity:
          anyOf:
            - $ref: "#/components/schemas/TextVerbosity"
            - type: "null"
      additionalProperties: false
    ResponseUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          format: uint32
          minimum: 0
        input_tokens_details:
          $ref: "#/components/schemas/ResponseInputTokensDetails"
        output_tokens:
          type: integer
          format: uint32
          minimum: 0
        output_tokens_details:
          $ref: "#/components/schemas/ResponseOutputTokensDetails"
        total_tokens:
          type: integer
          format: uint32
          minimum: 0
      required:
        - input_tokens
        - input_tokens_details
        - output_tokens
        - output_tokens_details
        - total_tokens
      additionalProperties: false
    ServiceTier:
      description: "`service_tier` request hint."
      type: string
      enum:
        - auto
        - default
        - flex
        - scale
        - priority
    ServiceTierResponse:
      description:
        "Service tier the backend reports it used. vLLM has no concept
        of tiers\nand always emits `None`; the field exists for spec completeness."
      type: string
      enum:
        - scale
        - default
        - flex
        - priority
    Stop:
      description:
        "OpenAI `stop` configuration. Accepts a single string, a string
        array,\nor — as a Dynamo / vLLM extension — an array of integer token IDs.\n
        Conversion into the unified request drops the token-id form; unified\nexpresses
        stops as strings only."
      anyOf:
        - type: string
        - type: array
          items:
            type: string
        - type: array
          items:
            type: integer
            format: uint32
            minimum: 0
    TextResponseFormatConfiguration:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: json_object
          required:
            - type
        - allOf:
            - $ref: "#/components/schemas/ResponseFormatJsonSchema"
            - type: object
              properties:
                type:
                  type: string
                  const: json_schema
              required:
                - type
    TextVerbosity:
      type: string
      enum:
        - low
        - medium
        - high
    TokenLogprob:
      description: Single-token logprob entry within a choice's logprobs payload.
      type: object
      properties:
        token:
          type: string
        logprob:
          type: number
          format: float
        bytes:
          anyOf:
            - type: array
              items:
                type: integer
                format: uint8
                minimum: 0
                maximum: 255
            - type: "null"
        top_logprobs:
          type: array
          items:
            $ref: "#/components/schemas/TopLogprob"
          default: []
      required:
        - token
        - logprob
      additionalProperties: false
    Tool:
      description:
        "One entry in the Responses-API `tools` array. Variants beyond\n
        `function` are passthrough JSON because they evolve frequently on\nOpenAI's
        side; only function tools have a fixed shape we need to act\non. Tag-based
        dispatch — unknown `type` values fail deserialization,\nmatching Dynamo /
        async-openai. Tool kinds added to OpenAI's spec\nrequire a new variant here."
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/FunctionTool"
            - type: object
              properties:
                type:
                  type: string
                  const: function
              required:
                - type
        - type: object
          properties:
            type:
              type: string
              const: file_search
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: web_search
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: computer_use_preview
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: mcp
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: code_interpreter
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: image_generation
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: local_shell
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: custom
          required:
            - type
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/FunctionType"
        function:
          $ref: "#/components/schemas/FunctionCall"
      required:
        - id
        - type
        - function
      additionalProperties: false
    ToolCallChunk:
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        id:
          anyOf:
            - type: string
            - type: "null"
        type:
          anyOf:
            - $ref: "#/components/schemas/FunctionType"
            - type: "null"
        function:
          anyOf:
            - $ref: "#/components/schemas/FunctionCallChunk"
            - type: "null"
      required:
        - index
      additionalProperties: false
    ToolChoiceAllowed:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/ToolChoiceAllowedMode"
        tools:
          type: array
          items: {}
      required:
        - mode
        - tools
    ToolChoiceAllowedMode:
      type: string
      enum:
        - auto
        - required
    ToolChoiceCustom:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    ToolChoiceFunction:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    ToolChoiceMCP:
      type: object
      properties:
        name:
          type: string
        server_label:
          type: string
      required:
        - name
        - server_label
    ToolChoiceMode:
      type: string
      enum:
        - none
        - auto
        - required
    ToolChoiceParam:
      description: "`tool_choice` request parameter."
      anyOf:
        - allOf:
            - $ref: "#/components/schemas/ToolChoiceAllowed"
            - type: object
              properties:
                type:
                  type: string
                  const: allowed_tools
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ToolChoiceFunction"
            - type: object
              properties:
                type:
                  type: string
                  const: function
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ToolChoiceMCP"
            - type: object
              properties:
                type:
                  type: string
                  const: mcp
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ToolChoiceCustom"
            - type: object
              properties:
                type:
                  type: string
                  const: custom
              required:
                - type
        - type: object
          properties:
            type:
              type: string
              const: apply_patch
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              const: shell
          required:
            - type
        - $ref: "#/components/schemas/HostedToolType"
        - $ref: "#/components/schemas/ToolChoiceMode"
    ToolSearchCallItemParam: {}
    ToolSearchOutputItemParam: {}
    TopLogProb:
      type: object
      properties:
        token:
          type: string
        logprob:
          type: number
          format: float
        bytes:
          anyOf:
            - type: array
              items:
                type: integer
                format: uint8
                minimum: 0
                maximum: 255
            - type: "null"
      required:
        - token
        - logprob
      additionalProperties: false
    TopLogprob:
      description: One of the top-k alternative tokens at a generation step.
      type: object
      properties:
        token:
          type: string
        logprob:
          type: number
          format: float
        bytes:
          anyOf:
            - type: array
              items:
                type: integer
                format: uint8
                minimum: 0
                maximum: 255
            - type: "null"
      required:
        - token
        - logprob
      additionalProperties: false
    Truncation:
      description: "`truncation` policy."
      type: string
      enum:
        - auto
        - disabled
    UrlCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          anyOf:
            - type: string
            - type: "null"
        start_index:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        end_index:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      required:
        - url
      additionalProperties: false
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: uint32
          minimum: 0
        total_tokens:
          type: integer
          format: uint32
          minimum: 0
        completion_tokens:
          type: integer
          format: uint32
          minimum: 0
        prompt_tokens_details:
          description:
            "Always serialized (as `null` when absent) to mirror vLLM's
            wire\nshape, which clients pin against."
          anyOf:
            - $ref: "#/components/schemas/PromptTokensDetails"
            - type: "null"
          default:
        completion_tokens_details:
          anyOf:
            - $ref: "#/components/schemas/CompletionTokensDetails"
            - type: "null"
      required:
        - prompt_tokens
        - total_tokens
        - completion_tokens
      additionalProperties: false
    Verbosity:
      description: Output-verbosity hint.
      type: string
      enum:
        - low
        - medium
        - high
    VideoUrl:
      description: "`video_url` payload (vLLM extension). Mirrors `ImageUrl` field-for-field."
      type: object
      properties:
        url:
          type: string
          format: uri
        detail:
          anyOf:
            - $ref: "#/components/schemas/ImageDetail"
            - type: "null"
        uuid:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - url
      additionalProperties: false
    WebSearchContextSize:
      type: string
      enum:
        - low
        - medium
        - high
    WebSearchLocation:
      type: object
      properties:
        city:
          anyOf:
            - type: string
            - type: "null"
        country:
          anyOf:
            - type: string
            - type: "null"
        region:
          anyOf:
            - type: string
            - type: "null"
        timezone:
          anyOf:
            - type: string
            - type: "null"
      additionalProperties: false
    WebSearchOptions:
      description: "`web_search_options` configuration."
      type: object
      properties:
        search_context_size:
          anyOf:
            - $ref: "#/components/schemas/WebSearchContextSize"
            - type: "null"
        user_location:
          anyOf:
            - $ref: "#/components/schemas/WebSearchUserLocation"
            - type: "null"
      additionalProperties: false
    WebSearchToolCall: {}
    WebSearchUserLocation:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/WebSearchUserLocationType"
        approximate:
          $ref: "#/components/schemas/WebSearchLocation"
      required:
        - type
        - approximate
      additionalProperties: false
    WebSearchUserLocationType:
      type: string
      enum:
        - approximate
    AnthropicCacheControl:
      description:
        'Anthropic-style cache control hint for prefix pinning with TTL.


        `type` is currently always `"ephemeral"`; `ttl` accepts integer seconds

        (`"600"`) or shorthand (`"5m"`, `"1h"`).'
      type: object
      properties:
        type:
          $ref: "#/components/schemas/AnthropicCacheControlType"
        ttl:
          anyOf:
            - type: string
            - type: "null"
      required:
        - type
      additionalProperties: false
    AnthropicCacheControlType:
      type: string
      enum:
        - ephemeral
        - unknown
    AnthropicContentBlock:
      description:
        "A single content block within a message.\n\nModels the well-known
        Anthropic block types explicitly and captures\nunknown / forward-compatible
        block types as `Other(Value)` so the proxy\ncan round-trip Claude features
        the gateway does not handle yet."
      anyOf:
        - type: object
          properties:
            text:
              type: string
            citations:
              anyOf:
                - type: array
                  items: {}
                - type: "null"
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: text
          required:
            - type
            - text
        - type: object
          properties:
            source:
              $ref: "#/components/schemas/AnthropicImageSource"
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: image
          required:
            - type
            - source
        - type: object
          properties:
            source: {}
            title:
              anyOf:
                - type: string
                - type: "null"
            context:
              anyOf:
                - type: string
                - type: "null"
            citations: {}
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: document
          required:
            - type
            - source
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            input: {}
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: tool_use
          required:
            - type
            - id
            - name
            - input
        - type: object
          properties:
            tool_use_id:
              type: string
            content:
              $ref: "#/components/schemas/AnthropicToolResultContent"
            is_error:
              type: boolean
              default: false
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: tool_result
          required:
            - type
            - tool_use_id
            - content
        - type: object
          properties:
            thinking:
              type: string
            signature:
              type: string
            cache_control:
              anyOf:
                - $ref: "#/components/schemas/AnthropicCacheControl"
                - type: "null"
            type:
              type: string
              const: thinking
          required:
            - type
            - thinking
            - signature
        - type: object
          properties:
            data:
              type: string
            type:
              type: string
              const: redacted_thinking
          required:
            - type
            - data
        - description:
            "Server-initiated tool use (e.g. web search). The model issues
            the\ntool call and the server executes it; the result returns as a\n`web_search_tool_result`
            (or sibling) block."
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            input:
              default:
            type:
              type: string
              const: server_tool_use
          required:
            - type
            - id
            - name
        - description: Result from a server-initiated web-search tool execution.
          type: object
          properties:
            tool_use_id:
              type: string
            content:
              default:
            type:
              type: string
              const: web_search_tool_result
          required:
            - type
            - tool_use_id
        - description:
            "Catch-all for unrecognized block types so the proxy can preserve\n
            blocks Claude has added but the gateway does not yet model."
    AnthropicContentBlockDelta:
      description:
        "Delta payload inside a `content_block_delta` SSE event. The variant
        tag\ndiscriminates on the chunked field — `text_delta` for plain text,\n`input_json_delta`
        for incremental tool-call JSON, `thinking_delta` and\n`signature_delta` for
        extended-reasoning blocks, `citations_delta` for\nstreamed citations attached
        to a text block."
      oneOf:
        - type: object
          properties:
            text:
              type: string
            type:
              type: string
              const: text_delta
          required:
            - type
            - text
        - type: object
          properties:
            partial_json:
              type: string
            type:
              type: string
              const: input_json_delta
          required:
            - type
            - partial_json
        - type: object
          properties:
            thinking:
              type: string
            type:
              type: string
              const: thinking_delta
          required:
            - type
            - thinking
        - type: object
          properties:
            signature:
              type: string
            type:
              type: string
              const: signature_delta
          required:
            - type
            - signature
        - type: object
          properties:
            citation: {}
            type:
              type: string
              const: citations_delta
          required:
            - type
            - citation
    AnthropicCountTokensRequest:
      required:
        - model
        - messages
      title: CountTokensRequest
      description: Request body for `POST /v1/messages/count_tokens`.
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        system:
          anyOf:
            - $ref: "#/components/schemas/AnthropicSystemPrompt"
            - type: "null"
          default:
        tools:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicTool"
              default:
            - type: "null"
        thinking:
          anyOf:
            - $ref: "#/components/schemas/AnthropicThinkingConfig"
            - type: "null"
          default:
        tool_choice:
          anyOf:
            - $ref: "#/components/schemas/AnthropicToolChoice"
            - type: "null"
          default:
      additionalProperties: false
    AnthropicCountTokensResponse:
      required:
        - input_tokens
      title: CountTokensResponse
      description: Response body for `POST /v1/messages/count_tokens`.
      type: object
      properties:
        input_tokens:
          type: integer
          format: uint32
          minimum: 0
      additionalProperties: false
    CreateMessagesRequest:
      required:
        - model
        - max_tokens
      title: CreateMessagesRequest
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
          minItems: 1
          default: []
        system:
          anyOf:
            - $ref: "#/components/schemas/AnthropicSystemPrompt"
            - type: "null"
          default:
        max_tokens:
          type: integer
          format: uint32
          minimum: 1
        temperature:
          anyOf:
            - type: number
              format: float
              default:
            - type: "null"
        top_p:
          anyOf:
            - type: number
              format: float
              default:
            - type: "null"
        top_k:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
              default:
            - type: "null"
        stop_sequences:
          anyOf:
            - type: array
              items:
                type: string
              default:
            - type: "null"
        stream:
          type: boolean
          default: false
        tools:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicTool"
              default:
            - type: "null"
        tool_choice:
          anyOf:
            - $ref: "#/components/schemas/AnthropicToolChoice"
            - type: "null"
          default:
        metadata:
          default:
        thinking:
          anyOf:
            - $ref: "#/components/schemas/AnthropicThinkingConfig"
            - type: "null"
          default:
        cache_control:
          description: Top-level cache control for automatic prompt prefix caching.
          anyOf:
            - $ref: "#/components/schemas/AnthropicCacheControl"
            - type: "null"
          default:
        service_tier:
          anyOf:
            - type: string
              description: 'Service tier selection: `"auto"` or `"standard_only"`.'
              default:
            - type: "null"
        container:
          anyOf:
            - type: string
              description: Container identifier for stateful sandbox sessions.
              default:
            - type: "null"
        output_config:
          description:
            "Output configuration: effort level and optional JSON schema
            format."
          default:
        anthropic_version:
          anyOf:
            - type: string
              description:
                Anthropic-version header echo. Forwarded for round-trip
                parity.
              default:
            - type: "null"
        anthropic_beta:
          anyOf:
            - type: array
              description: Beta-feature opt-ins.
              items:
                type: string
              default:
            - type: "null"
      additionalProperties: false
    CreateMessagesResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        role:
          type: string
        model:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicOutputBlock"
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/AnthropicStopReason"
            - type: "null"
        stop_sequence:
          anyOf:
            - type: string
            - type: "null"
        usage:
          $ref: "#/components/schemas/AnthropicUsage"
        anthropic_version:
          anyOf:
            - type: string
              description:
                "Anthropic-version header echo. Populated when the proxy
                mirrors it\nonto the response body."
            - type: "null"
        container:
          anyOf:
            - type: string
              description:
                "Container identifier echoed back when the request used
                a stateful\nsandbox session."
            - type: "null"
      required:
        - id
        - type
        - role
        - model
        - content
        - usage
      additionalProperties: false
    AnthropicCreateMessagesStreamResponse:
      oneOf:
        - description:
            "First event. Carries the initial message envelope (id, model,
            empty\n`content`, initial `usage` with `input_tokens` populated)."
          type: object
          properties:
            message:
              $ref: "#/components/schemas/CreateMessagesResponse"
            type:
              type: string
              const: message_start
          required:
            - type
            - message
        - description:
            "Final summary event. Carries `delta.stop_reason` /\n`delta.stop_sequence`
            plus cumulative final `usage`."
          type: object
          properties:
            delta:
              $ref: "#/components/schemas/AnthropicMessageDeltaBody"
            usage:
              $ref: "#/components/schemas/AnthropicUsage"
            type:
              type: string
              const: message_delta
          required:
            - type
            - delta
            - usage
        - description:
            "Terminal event. Empty payload; presence of this event closes
            the\nstream from the protocol's perspective."
          type: object
          properties:
            type:
              type: string
              const: message_stop
          required:
            - type
        - description:
            "Marks the start of an output content block at `index`. The\n
            `content_block` is shape-only (empty text, empty input)."
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            content_block:
              $ref: "#/components/schemas/AnthropicOutputBlock"
            type:
              type: string
              const: content_block_start
          required:
            - type
            - index
            - content_block
        - description: Incremental update to the block at `index`.
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            delta:
              $ref: "#/components/schemas/AnthropicContentBlockDelta"
            type:
              type: string
              const: content_block_delta
          required:
            - type
            - index
            - delta
        - description: Marks the block at `index` as complete.
          type: object
          properties:
            index:
              type: integer
              format: uint32
              minimum: 0
            type:
              type: string
              const: content_block_stop
          required:
            - type
            - index
        - description: Server-side keepalive. Carries no payload; safe to ignore.
          type: object
          properties:
            type:
              type: string
              const: ping
          required:
            - type
        - description: Stream-level error. Closes the stream.
          type: object
          properties:
            error:
              $ref: "#/components/schemas/AnthropicErrorBody"
            type:
              type: string
              const: error
          required:
            - type
            - error
      title: CreateMessagesStreamResponse
      description: 'SSE event union for `POST /v1/messages` streaming responses.


        Wire shape: each variant serializes as `{"type": "<event>", ...}` and

        is emitted as the JSON body of an SSE frame. The SSE `event:` line

        matches the JSON `type` discriminator by convention; clients dispatch

        on either independently.


        Typical event order for a plain-text turn:


        ```text

        message_start

        content_block_start  (index=0, type=text)

        content_block_delta  (text_delta, repeated)

        content_block_stop   (index=0)

        message_delta        (stop_reason, final usage)

        message_stop

        ```'
    AnthropicErrorBody:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
      required:
        - type
        - message
      additionalProperties: false
    AnthropicErrorEnvelope:
      required:
        - type
        - error
      title: AnthropicErrorEnvelope
      type: object
      properties:
        type:
          type: string
        error:
          $ref: "#/components/schemas/AnthropicErrorBody"
      additionalProperties: false
    AnthropicImageSource:
      description:
        "Image source descriptor — base64-encoded inline data or a remote
        URL."
      type: object
      properties:
        type:
          type: string
        media_type:
          anyOf:
            - type: string
            - type: "null"
        data:
          anyOf:
            - type: string
            - type: "null"
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
      required:
        - type
      additionalProperties: false
    AnthropicMessage:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AnthropicRole"
        content:
          $ref: "#/components/schemas/AnthropicMessageContent"
      required:
        - role
        - content
      additionalProperties: false
    AnthropicMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicContentBlock"
    AnthropicMessageDeltaBody:
      description:
        "Body of a `message_delta` SSE event. Carries the terminal `stop_reason`\n
        plus the matched stop sequence (if any). Cumulative `usage` rides on\nthe
        parent `CreateMessagesStreamResponse::MessageDelta` event."
      type: object
      properties:
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/AnthropicStopReason"
            - type: "null"
        stop_sequence:
          anyOf:
            - type: string
            - type: "null"
      additionalProperties: false
    AnthropicModelObject:
      required:
        - id
        - type
        - display_name
        - created_at
      title: AnthropicModelObject
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        display_name:
          type: string
        created_at:
          type: string
        max_input_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      additionalProperties: false
    AnthropicModelsResponse:
      required:
        - data
        - has_more
      title: AnthropicModelsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicModelObject"
        has_more:
          type: boolean
        first_id:
          anyOf:
            - type: string
            - type: "null"
        last_id:
          anyOf:
            - type: string
            - type: "null"
      additionalProperties: false
    AnthropicOutputBlock:
      description:
        "Output content block for the non-streaming response. The streaming\n
        `content_block_start` event reuses the same enum."
      anyOf:
        - type: object
          properties:
            text:
              type: string
            citations:
              anyOf:
                - type: array
                  items: {}
                - type: "null"
            type:
              type: string
              const: text
          required:
            - type
            - text
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            input: {}
            type:
              type: string
              const: tool_use
          required:
            - type
            - id
            - name
            - input
        - type: object
          properties:
            thinking:
              type: string
            signature:
              type: string
            type:
              type: string
              const: thinking
          required:
            - type
            - thinking
            - signature
        - type: object
          properties:
            data:
              type: string
            type:
              type: string
              const: redacted_thinking
          required:
            - type
            - data
        - description:
            "Server-initiated tool call (e.g. web_search). The matching
            result\narrives as `web_search_tool_result` or a sibling block."
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            input:
              default:
            type:
              type: string
              const: server_tool_use
          required:
            - type
            - id
            - name
        - description: Result of a server-initiated web_search tool call.
          type: object
          properties:
            tool_use_id:
              type: string
            content:
              default:
            type:
              type: string
              const: web_search_tool_result
          required:
            - type
            - tool_use_id
        - description:
            "Catch-all for response blocks the gateway does not yet model\n
            (`web_fetch_tool_result`, `code_execution_tool_result`, etc.) so\nthey
            round-trip unchanged."
    AnthropicRole:
      oneOf:
        - type: string
          enum:
            - user
            - assistant
        - description:
            "Compatibility for clients (e.g. Claude Code) that place system\n
            instructions in `messages[]` instead of the top-level `system` field."
          type: string
          const: system
    AnthropicStopReason:
      oneOf:
        - type: string
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
            - tool_use
        - description:
            "Model paused mid-turn intending to continue (extended thinking
            /\ntool-use loops)."
          type: string
          const: pause_turn
        - description: "Safety refusal — model declined to generate content."
          type: string
          const: refusal
    AnthropicSystemPrompt:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicSystemTextBlock"
    AnthropicSystemTextBlock:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        cache_control:
          anyOf:
            - $ref: "#/components/schemas/AnthropicCacheControl"
            - type: "null"
        citations:
          anyOf:
            - type: array
              items: {}
            - type: "null"
      required:
        - type
        - text
      additionalProperties: false
    AnthropicThinkingConfig:
      type: object
      properties:
        type:
          type: string
        budget_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      required:
        - type
      additionalProperties: false
    AnthropicTool:
      description:
        "Tool declaration. Client tools require `name` + `input_schema`;
        server\ntools (web_search, code_execution, ...) are discriminated by `type`
        and\nmay omit `input_schema`. All non-`name` fields stay optional so both\n
        kinds deserialize."
      type: object
      properties:
        name:
          type: string
        type:
          anyOf:
            - type: string
            - type: "null"
        description:
          anyOf:
            - type: string
            - type: "null"
        input_schema: {}
        cache_control:
          anyOf:
            - $ref: "#/components/schemas/AnthropicCacheControl"
            - type: "null"
      required:
        - name
      additionalProperties: false
    AnthropicToolChoice:
      oneOf:
        - type: object
          properties:
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: auto
          required:
            - type
        - type: object
          properties:
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: any
          required:
            - type
        - type: object
          properties:
            name:
              type: string
            disable_parallel_tool_use:
              anyOf:
                - type: boolean
                - type: "null"
            type:
              type: string
              const: tool
          required:
            - type
            - name
        - type: object
          properties:
            type:
              type: string
              const: none
          required:
            - type
    AnthropicToolResultBlock:
      oneOf:
        - type: object
          properties:
            text:
              type: string
            type:
              type: string
              const: text
          required:
            - type
            - text
        - type: object
          properties:
            source: {}
            type:
              type: string
              const: image
          required:
            - type
            - source
    AnthropicToolResultContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/AnthropicToolResultBlock"
    AnthropicUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          format: uint32
          minimum: 0
        output_tokens:
          type: integer
          format: uint32
          minimum: 0
        cache_creation_input_tokens:
          anyOf:
            - type: integer
              description: Number of input tokens used to create a new cache entry.
              format: uint32
              minimum: 0
            - type: "null"
        cache_read_input_tokens:
          anyOf:
            - type: integer
              description:
                Number of input tokens read from the prompt cache (prefix
                cache hits).
              format: uint32
              minimum: 0
            - type: "null"
        cache_creation:
          description: Breakdown of `cache_creation_input_tokens` by cache TTL bucket.
        service_tier:
          anyOf:
            - type: string
              description:
                'Service tier that actually served the request (`"standard"`
                /

                `"priority"` / `"batch"`).'
            - type: "null"
        server_tool_use:
          description: Per-server-tool token counts (e.g. web_search requests).
      required:
        - input_tokens
        - output_tokens
      additionalProperties: false
tags:
  - name: models
    description: models for OpenAI/Anthropic compatible Models API.
  - name: chat
    description: OpenAI-compatible Chat API.
  - name: completions
    description: OpenAI-compatible Completions API.
  - name: responses
    description: OpenAI-compatible Responses API.
  - name: messages
    description: Anthropic-compatible Messages API.
  - name: system
    description: System endpoints for health, metrics, and debugging.
