      title: CreateResponseStreamResponse
      description:
        'SSE event union for `POST /v1/responses` streaming responses.


        Each variant serializes as `{"type": "response.<event>", ...}` with

        a monotonic `sequence_number` field for client-side event ordering.

        Lifecycle events (`response.created`, `response.in_progress`, etc.)

        embed the full `CreateResponseResponse` snapshot; per-item / per-part

        events carry `(item_id, output_index, content_index)` plus the

        incremental payload.


        Typical event order for a plain-text turn:


        ```text

        response.created

        response.in_progress

        response.output_item.added       (type: message)

        response.content_part.added      (type: output_text)

        response.output_text.delta       (repeated)

        response.output_text.done

        response.content_part.done

        response.output_item.done

        response.completed               (final usage)

        ```


        Out of scope: MCP tool calls, code interpreter, web/file search, image

        generation, custom tool calls, queued background responses, and reasoning

        summary parts.'
