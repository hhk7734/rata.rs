openapi: 3.1.2
info:
  title: LLM API
  description: OpenAI-compatible and Anthropic-compatible endpoints.
  version: 0.1.0
servers:
  - url: http://localhost:8000
  - url: http://localhost:8001
paths:
  /v1/models:
    get:
      tags:
        - models
      summary: List Models
      description: Returns a list of available models.
      responses:
        "200":
          description: A list of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
  /v1/models/{model_id}:
    get:
      tags:
        - models
      summary: Get a Model
      description: Retrieves a specific model by ID.
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelObject"
  /v1/chat/completions:
    post:
      tags:
        - chat
      summary: Create a Chat Completion
      description: Creates a model response for the given chat conversation.
      requestBody:
        $ref: "#/components/requestBodies/CreateChatCompletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreateChatCompletionResponse"
  /v1/completions:
    post:
      tags:
        - completions
      summary: Create a Completion
      description: Creates a completion for the provided prompt and parameters.
      requestBody:
        $ref: "#/components/requestBodies/CreateCompletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreateCompletionResponse"
  /v1/messages:
    post:
      tags:
        - messages
      summary: Create a Message
      description: Creates a message using the Anthropic API format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessagesRequest"
      responses:
        "200":
          description: A message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessagesResponse"
  /v1/responses:
    post:
      tags:
        - responses
      summary: Create a Response
      description: Responses endpoint.
      responses:
        "200":
          description: A response object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponseResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseRequest"
  /health:
    get:
      summary: Get Health
      description: Returns the health status of the gateway.
      responses:
        "200":
          description: Gateway is healthy
  /metrics:
    get:
      tags:
        - system
      summary: Get Metrics
      description: Prometheus metrics endpoint.
      responses:
        "200":
          description: Prometheus metrics payload
          content:
            text/plain:
              schema:
                type: string
  /debug/metrics-store:
    get:
      tags:
        - system
      summary: Get Metrics for debugging
      description: Returns internal metrics store state for debugging.
      responses:
        "200":
          description: Debug info
  /debug/reset-prefix-cache:
    post:
      tags:
        - system
      summary: Reset Prefix Cache
      description: Resets the prefix cache for debugging purposes.
      responses:
        "200":
          description: Cache reset successful
components:
  requestBodies:
    CreateChatCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateChatCompletionRequest"
    CreateCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCompletionRequest"
  responses:
    CreateChatCompletionResponse:
      description: A chat completion response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateChatCompletionResponse"
    CreateCompletionResponse:
      description: A completion response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCompletionResponse"
  schemas:
    Annotation:
      description: Citation / annotation attached to an `output_text` part.
      anyOf:
        - type: object
          properties:
            file_id:
              type: string
            index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            filename:
              anyOf:
                - type: string
                - type: "null"
            type:
              type: string
              const: file_citation
          required:
            - type
            - file_id
        - type: object
          properties:
            url:
              type: string
              format: uri
            title:
              anyOf:
                - type: string
                - type: "null"
            start_index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            end_index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            type:
              type: string
              const: url_citation
          required:
            - type
            - url
        - type: object
          properties:
            file_id:
              type: string
            index:
              anyOf:
                - type: integer
                  format: uint32
                  minimum: 0
                - type: "null"
            type:
              type: string
              const: file_path
          required:
            - type
            - file_id
        - description: Forward-compatible catch-all.
    ApplyPatchToolCallItemParam: {}
    ApplyPatchToolCallOutputItemParam: {}
    AssistantRole:
      description:
        'Single-variant role enum used to constrain `InputOutputMessage.role`

        to `"assistant"` only.'
      type: string
      enum:
        - assistant
    AudioUrl:
      description:
        "`audio_url` payload (vLLM extension). Distinct from OpenAI's base64\n
        `input_audio` shape."
      type: object
      properties:
        url:
          type: string
          format: uri
        uuid:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - url
      additionalProperties: false
    ChatChoiceLogprobs:
      description:
        "Per-choice logprobs payload. `content` carries assistant-content
        tokens;\n`refusal` carries refusal-content tokens (kept for spec parity)."
      type: object
      properties:
        content:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/TokenLogprob"
            - type: "null"
        refusal:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/TokenLogprob"
            - type: "null"
      additionalProperties: false
    ChatCompletionAudio:
      description:
        "`audio` request configuration — voice + output format for audio\n
        modality responses."
      type: object
      properties:
        voice:
          $ref: "#/components/schemas/ChatCompletionAudioVoice"
        format:
          $ref: "#/components/schemas/ChatCompletionAudioFormat"
      required:
        - voice
        - format
      additionalProperties: false
    ChatCompletionAudioFormat:
      type: string
      enum:
        - wav
        - aac
        - mp3
        - flac
        - opus
        - pcm16
    ChatCompletionAudioVoice:
      type: string
      enum:
        - alloy
        - ash
        - ballad
        - coral
        - echo
        - fable
        - onyx
        - nova
        - sage
        - shimmer
        - verse
    ChatCompletionNamedToolChoice:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ChatCompletionToolType"
        function:
          $ref: "#/components/schemas/FunctionName"
      required:
        - type
        - function
      additionalProperties: false
    ChatCompletionRequestAssistantMessage:
      type: object
      properties:
        content:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContent"
            - type: "null"
        reasoning_content:
          anyOf:
            - $ref: "#/components/schemas/ReasoningContent"
            - type: "null"
        refusal:
          anyOf:
            - type: string
            - type: "null"
        name:
          anyOf:
            - type: string
            - type: "null"
        audio:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageAudio"
            - type: "null"
        tool_calls:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolCall"
            - type: "null"
    ChatCompletionRequestAssistantMessageAudio:
      description:
        Assistant-side audio reference echoed back in multi-turn audio
        threads.
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    ChatCompletionRequestAssistantMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContentPart"
    ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            - type: object
              properties:
                type:
                  type: string
                  const: text
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartRefusal"
            - type: object
              properties:
                type:
                  type: string
                  const: refusal
              required:
                - type
    ChatCompletionRequestDeveloperMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestDeveloperMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessageContentPart"
    ChatCompletionRequestDeveloperMessageContentPart:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            - type: object
              properties:
                type:
                  type: string
                  const: text
              required:
                - type
    ChatCompletionRequestMessage:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestSystemMessage"
            - type: object
              properties:
                role:
                  type: string
                  const: system
              required:
                - role
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessage"
            - type: object
              properties:
                role:
                  type: string
                  const: developer
              required:
                - role
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestUserMessage"
            - type: object
              properties:
                role:
                  type: string
                  const: user
              required:
                - role
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessage"
            - type: object
              properties:
                role:
                  type: string
                  const: assistant
              required:
                - role
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestToolMessage"
            - type: object
              properties:
                role:
                  type: string
                  const: tool
              required:
                - role
    ChatCompletionRequestMessageContentPartAudio:
      description: '`{"type":"input_audio","input_audio":{...}}` content part.'
      type: object
      properties:
        input_audio:
          $ref: "#/components/schemas/InputAudio"
      required:
        - input_audio
    ChatCompletionRequestMessageContentPartAudioUrl:
      description: '`{"type":"audio_url","audio_url":{...}}` content part (vLLM extension).'
      type: object
      properties:
        audio_url:
          $ref: "#/components/schemas/AudioUrl"
      required:
        - audio_url
    ChatCompletionRequestMessageContentPartFile:
      description:
        '`{"type":"file","file":{...}}` content part. `file` is left typed
        as

        `serde_json::Value` because OpenAI accepts multiple sub-shapes

        (`{file_id}`, `{file_data, filename}`) that the gateway forwards as-is.'
      type: object
      properties:
        file: {}
      required:
        - file
    ChatCompletionRequestMessageContentPartImage:
      description: '`{"type":"image_url","image_url":{...}}` content part.'
      type: object
      properties:
        image_url:
          $ref: "#/components/schemas/ImageUrl"
      required:
        - image_url
    ChatCompletionRequestMessageContentPartRefusal:
      description:
        "Body for `{\"type\":\"refusal\",\"refusal\":\"…\"}` content parts.
        Only valid\non assistant turns echoed back as input — refusal text from a
        prior\nresponse."
      type: object
      properties:
        refusal:
          type: string
      required:
        - refusal
    ChatCompletionRequestMessageContentPartText:
      description: 'Shared body for every `{"type":"text","text":"…"}` content
        part.'
      type: object
      properties:
        text:
          type: string
      required:
        - text
    ChatCompletionRequestMessageContentPartVideo:
      description: '`{"type":"video_url","video_url":{...}}` content part (vLLM extension).'
      type: object
      properties:
        video_url:
          $ref: "#/components/schemas/VideoUrl"
      required:
        - video_url
    ChatCompletionRequestSystemMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestSystemMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestSystemMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestSystemMessageContentPart"
    ChatCompletionRequestSystemMessageContentPart:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            - type: object
              properties:
                type:
                  type: string
                  const: text
              required:
                - type
    ChatCompletionRequestToolMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestToolMessageContent"
        tool_call_id:
          type: string
      required:
        - content
        - tool_call_id
    ChatCompletionRequestToolMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestToolMessageContentPart"
    ChatCompletionRequestToolMessageContentPart:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            - type: object
              properties:
                type:
                  type: string
                  const: text
              required:
                - type
    ChatCompletionRequestUserMessage:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/ChatCompletionRequestUserMessageContent"
        name:
          anyOf:
            - type: string
            - type: "null"
      required:
        - content
    ChatCompletionRequestUserMessageContent:
      anyOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestUserMessageContentPart"
    ChatCompletionRequestUserMessageContentPart:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            - type: object
              properties:
                type:
                  type: string
                  const: text
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartImage"
            - type: object
              properties:
                type:
                  type: string
                  const: image_url
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartAudio"
            - type: object
              properties:
                type:
                  type: string
                  const: input_audio
              required:
                - type
        - description: "vLLM extension: video reference passed by URL."
          allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartVideo"
            - type: object
              properties:
                type:
                  type: string
                  const: video_url
              required:
                - type
        - description:
            "vLLM extension: audio reference passed by URL (distinct from
            base64\n`input_audio`)."
          allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartAudioUrl"
            - type: object
              properties:
                type:
                  type: string
                  const: audio_url
              required:
                - type
        - allOf:
            - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartFile"
            - type: object
              properties:
                type:
                  type: string
                  const: file
              required:
                - type
    ChatCompletionResponseMessageAudio:
      description:
        "Audio reference returned on assistant messages when the response\n
        includes the `audio` modality."
      type: object
      properties:
        id:
          type: string
        expires_at:
          anyOf:
            - type: integer
              format: uint64
              minimum: 0
            - type: "null"
        data:
          anyOf:
            - type: string
            - type: "null"
        transcript:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
      additionalProperties: false
    ChatCompletionStreamOptions:
      description:
        "Streaming options. Extends OpenAI's spec with vLLM / SGLang's\n
        `continuous_usage_stats` flag (per-chunk usage instead of trailing-only).\n
        \nBoth fields default to `false` when absent so an empty object\n(`\"stream_options\"\
        : {}`) deserializes as a no-op — matching the\npre-Dynamo-mirror behavior
        where `include_usage` was `Option<bool>`."
      type: object
      properties:
        include_usage:
          type: boolean
          default: false
        continuous_usage_stats:
          type: boolean
          default: false
      additionalProperties: false
    ChatCompletionTool:
      description: One entry in the request's `tools` array.
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ChatCompletionToolType"
          default: function
        function:
          $ref: "#/components/schemas/FunctionObject"
      required:
        - function
      additionalProperties: false
    ChatCompletionToolChoiceOption:
      description:
        "Tool-choice policy. The lowercase string variants (`none` / `auto`
        /\n`required`) match OpenAI's spec; a specific named tool deserializes\nfrom
        the struct form `{ \"type\": \"function\", \"function\": { \"name\": \"…\"\
        \ } }`."
      anyOf:
        - type: string
          enum:
            - none
            - auto
            - required
        - $ref: "#/components/schemas/ChatCompletionNamedToolChoice"
    ChatCompletionToolType:
      description: Tool-type discriminator. OpenAI currently defines only `function`.
      type: string
      enum:
        - function
    Choice:
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        message:
          $ref: "#/components/schemas/ResponseMessage"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ChatChoiceLogprobs"
            - type: "null"
          default:
        finish_reason:
          oneOf:
            - $ref: "#/components/schemas/FinishReason"
            - type: "null"
      required:
        - index
        - message
      additionalProperties: false
    ChunkChoice:
      type: object
      properties:
        index:
          type: integer
          format: uint32
          minimum: 0
        delta:
          $ref: "#/components/schemas/Delta"
        finish_reason:
          anyOf:
            - $ref: "#/components/schemas/FinishReason"
            - type: "null"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ChatChoiceLogprobs"
            - type: "null"
      required:
        - index
        - delta
      additionalProperties: false
    CodeInterpreterToolCall: {}
    CompactionSummaryItemParam: {}
    CompletionChoice:
      type: object
      properties:
        text:
          type: string
        index:
          type: integer
          format: uint32
          minimum: 0
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/Logprobs"
            - type: "null"
        finish_reason:
          anyOf:
            - type: string
            - type: "null"
      required:
        - text
        - index
      additionalProperties: false
    CompletionTokensDetails:
      type: object
      properties:
        reasoning_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        audio_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        accepted_prediction_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
        rejected_prediction_tokens:
          anyOf:
            - type: integer
              format: uint32
              minimum: 0
            - type: "null"
      additionalProperties: false
    CompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: uint32
          minimum: 0
        completion_tokens:
          type: integer
          format: uint32
          minimum: 0
        total_tokens:
          type: integer
          format: uint32
          minimum: 0
        prompt_tokens_details:
          anyOf:
            - $ref: "#/components/schemas/PromptTokensDetails"
            - type: "null"
        completion_tokens_details:
          anyOf:
            - $ref: "#/components/schemas/CompletionTokensDetails"
            - type: "null"
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      additionalProperties: false
    ComputerCallOutputItemParam: {}
    ComputerToolCall: {}
    ContentBlock:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        annotations:
          anyOf:
            - type: array
              items: {}
            - type: "null"
        logprobs:
          anyOf:
            - $ref: "#/components/schemas/ContentBlockLogprobs"
            - type: "null"
      required:
        - type
        - text
      additionalProperties: false
    ContentBlockLogprobs:
      anyOf:
        - type: array
          items:
            $ref: "#/components/schemas/LogProb"
        - type: "null"
    ConversationParam:
      description:
        "`conversation` request parameter — either an id reference or an\n
        inline new-conversation spec."
      anyOf:
        - type: string
        - {}
    CreateChatCompletionRequest:
      required:
        - model
        - messages
      title: CreateChatCompletionRequest
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionRequestMessage"
          minItems: 1
        temperature:
          anyOf:
            - type: number
              format: float
            - type: "null"
        top_p:
          anyOf:
            - type: number
              format: float
            - type: "null"
        top_k:
          anyOf:
            - type: integer
              description: "vLLM-extension: top-k sampling. `0` disables."
              format: int32
            - type: "null"
        min_p:
          anyOf:
            - type: number
              description:
                "vLLM-extension: minimum token probability relative to
                the top token."
              format: float
            - type: "null"
        repetition_penalty:
          anyOf:
            - type: number
              description: "vLLM-extension: repetition penalty (`1.0` = neutral)."
              format: float
            - type: "null"
        max_completion_tokens:
          anyOf:
            - type: integer
              description:
                "Accepts the deprecated `max_tokens` JSON key as an alias.
                Sending\nboth keys in a single request is rejected at deserialize
                as a\nduplicate field."
              format: uint32
              minimum: 0
            - type: "null"
        min_tokens:
          anyOf:
            - type: integer
              description:
                "vLLM-extension: minimum tokens to generate before EOS
                / stop can\nend the response."
              format: uint32
              minimum: 0
            - type: "null"
        n:
          anyOf:
            - type: integer
              description:
                "Number of completion choices to generate. OpenAI caps
                at 128;\n`u8` (max 255) is the soft upper bound — the backend enforces
                any\ntighter limit. `n = 0` is rejected at validation time."
              format: uint8
              minimum: 1
              maximum: 255
            - type: "null"
        stop:
          anyOf:
            - $ref: "#/components/schemas/Stop"
            - type: "null"
        ignore_eos:
          anyOf:
            - type: boolean
              description:
                "vLLM-extension: continue generating past EOS until\n`max_completion_tokens`
                is reached."
            - type: "null"
        seed:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
        presence_penalty:
          anyOf:
            - type: number
              format: float
            - type: "null"
        frequency_penalty:
          anyOf:
            - type: number
              format: float
            - type: "null"
        stream:
          anyOf:
            - type: boolean
            - type: "null"
        stream_options:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionStreamOptions"
            - type: "null"
        reasoning_effort:
          anyOf:
            - $ref: "#/components/schemas/ReasoningEffort"
            - type: "null"
        thinking_token_budget:
          anyOf:
            - type: integer
              description:
                "vLLM-extension: cap on tokens emitted during the thinking
                phase."
              format: uint32
              minimum: 0
            - type: "null"
        tools:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ChatCompletionTool"
            - type: "null"
        tool_choice:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionToolChoiceOption"
            - type: "null"
        parallel_tool_calls:
          anyOf:
            - type: boolean
            - type: "null"
        logprobs:
