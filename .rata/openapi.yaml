openapi: 3.1.2
info:
  title: LLM API
  description: OpenAI-compatible and Anthropic-compatible endpoints.
  version: 0.1.0
servers:
  - url: http://localhost:8000
  - url: http://localhost:8001
paths:
  /v1/models:
    get:
      tags:
        - models
      summary: List Models
      description: Returns a list of available models.
      responses:
        "200":
          $ref: "./components/responses/ListModelsResponse.yaml"
  /v1/models/{model_id}:
    get:
      tags:
        - models
      summary: Get a Model
      description: Retrieves a specific model by ID.
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "./components/responses/GetModelResponse.yaml"
  /v1/chat/completions:
    post:
      tags:
        - chat
      summary: Create a Chat Completion
      description: Creates a model response for the given chat conversation.
      requestBody:
        $ref: "./components/requestBodies/CreateChatCompletionRequest.yaml"
      responses:
        "200":
          $ref: "./components/responses/CreateChatCompletionResponse.yaml"
  /v1/completions:
    post:
      tags:
        - completions
      summary: Create a Completion
      description: Creates a completion for the provided prompt and parameters.
      requestBody:
        $ref: "./components/requestBodies/CreateCompletionRequest.yaml"
      responses:
        "200":
          $ref: "./components/responses/CreateCompletionResponse.yaml"
  /v1/messages:
    post:
      tags:
        - messages
      summary: Create a Message
      description: Creates a message using the Anthropic API format.
      requestBody:
        $ref: "./components/requestBodies/CreateMessagesRequest.yaml"
      responses:
        "200":
          $ref: "./components/responses/CreateMessagesResponse.yaml"
  /v1/messages/count_tokens:
    post:
      tags:
        - messages
      summary: Count Tokens
      description: Count the number of tokens in a Message.
      requestBody:
        $ref: "./components/requestBodies/AnthropicCountMessagesTokensRequest.yaml"
      responses:
        "200":
          $ref: "./components/responses/AnthropicCountMessagesTokensResponse.yaml"
  /v1/responses:
    post:
      tags:
        - responses
      summary: Create a Response
      description: Responses endpoint.
      requestBody:
        $ref: "./components/requestBodies/CreateResponseRequest.yaml"
      responses:
        "200":
          $ref: "./components/responses/CreateResponseResponse.yaml"
  /health:
    get:
      summary: Get Health
      description: Returns the health status of the gateway.
      responses:
        "200":
          $ref: "./components/responses/GetHealthResponse.yaml"
  /metrics:
    get:
      tags:
        - system
      summary: Get Metrics
      description: Prometheus metrics endpoint.
      responses:
        "200":
          $ref: "./components/responses/GetMetricsResponse.yaml"
  /debug/metrics-store:
    get:
      tags:
        - system
      summary: Get Metrics for debugging
      description: Returns internal metrics store state for debugging.
      responses:
        "200":
          $ref: "./components/responses/GetDebugMetricsStoreResponse.yaml"
  /debug/reset-prefix-cache:
    post:
      tags:
        - system
      summary: Reset Prefix Cache
      description: Resets the prefix cache for debugging purposes.
      responses:
        "200":
          $ref: "./components/responses/ResetPrefixCacheResponse.yaml"
tags:
  - name: models
    description: models for OpenAI/Anthropic compatible Models API.
  - name: chat
    description: OpenAI-compatible Chat API.
  - name: completions
    description: OpenAI-compatible Completions API.
  - name: responses
    description: OpenAI-compatible Responses API.
  - name: messages
    description: Anthropic-compatible Messages API.
  - name: system
    description: System endpoints for health, metrics, and debugging.
